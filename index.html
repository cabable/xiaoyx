}

/* ============ 小地图（右下角鸟瞰） ============
 * 赛道底稿只在切赛道时预渲染一次（离屏 canvas），每帧只 drawImage + 画动态点，
 * 避免每帧重描 1200 段折线。弯道着色直接复用 AI 用的 trackCurv。 */
const MM = 150, MM_PAD = 12;
const mmCanvas = document.getElementById('minimap');
const mmCtx = mmCanvas.getContext('2d');
let mmReady = false, mmOff = null, mmShown = false;
let mmScale = 1, mmMinX = 0, mmMinZ = 0, mmOffX = 0, mmOffY = 0;
const mmPx = (x, z) => [mmOffX + (x - mmMinX) * mmScale, mmOffY + (z - mmMinZ) * mmScale];

function buildMinimap(){
  mmReady = false;
  if (!S || S.length < 2) return;
  let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for (const p of S){
    if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
    if (p.z < minZ) minZ = p.z; if (p.z > maxZ) maxZ = p.z;
  }
  const w = Math.max(maxX - minX, 1), h = Math.max(maxZ - minZ, 1);
  mmScale = (MM - MM_PAD * 2) / Math.max(w, h);
  mmOffX = (MM - w * mmScale) / 2; mmOffY = (MM - h * mmScale) / 2;
  mmMinX = minX; mmMinZ = minZ;

  mmOff = document.createElement('canvas');
  mmOff.width = MM; mmOff.height = MM;
  const c = mmOff.getContext('2d');
  c.lineJoin = 'round'; c.lineCap = 'round';
  // 赛道底稿（渐变效果）
  c.strokeStyle = 'rgba(148,163,184,.35)'; c.lineWidth = 7;
  c.beginPath();
  for (let i = 0; i <= N_SAMPLES; i++){
    const p = S[i % N_SAMPLES], q = mmPx(p.x, p.z);
    if (i) c.lineTo(q[0], q[1]); else c.moveTo(q[0], q[1]);
  }
  c.stroke();
  // 赛道中心线
  c.strokeStyle = 'rgba(148,163,184,.20)'; c.lineWidth = 2;
  c.beginPath();
  for (let i = 0; i <= N_SAMPLES; i++){
    const p = S[i % N_SAMPLES], q = mmPx(p.x, p.z);
    if (i) c.lineTo(q[0], q[1]); else c.moveTo(q[0], q[1]);
  }
  c.stroke();
  // 起终点棋格旗样式
  const s0 = mmPx(S[0].x, S[0].z);
  c.fillStyle = '#e2e8f0';
  for (let r = 0; r < 3; r++){
    for (let col = 0; col < 3; col++){
      if ((r + col) % 2 === 0){
        c.fillRect(s0[0] - 3 + col * 3, s0[1] - 4.5 + r * 3, 3, 3);
      }
    }
  }
  // 赛道名称
  const trackName = TRACK_DEFS[currentTrack] ? TRACK_DEFS[currentTrack].name : currentTrack;
  c.fillStyle = 'rgba(255,255,255,.50)';
  c.font = 'bold 10px sans-serif';
  c.textAlign = 'center';
  c.fillText(trackName, MM / 2, 14);
  mmReady = true;
}

function updateMinimap(){
  if (!mmReady || !mmOff) return;
  const c = mmCtx;
  c.clearRect(0, 0, MM, MM);
  c.drawImage(mmOff, 0, 0);
  // 弯道指示（简单版：显示当前曲率大小）
  const nearestI = player.nearestI || 0;
  const curv = trackCurv[nearestI] || 0;
  let turnIcon = '→';
  let turnCol = 'rgba(255,255,255,.5)';
  if (curv > 1/30){ turnIcon = '⬅'; turnCol = '#f87171'; } // 急弯
  else if (curv > 1/60){ turnIcon = '↩'; turnCol = '#fbbf24'; } // 弯道
  c.fillStyle = turnCol;
  c.font = 'bold 16px sans-serif';
  c.textAlign = 'center';
  c.fillText(turnIcon, MM / 2, 16);
  // AI 车辆
  if (mode === 'race'){
    for (const b of bots){
      if (!b.group.visible) continue;
      const q = mmPx(b.pos.x, b.pos.z);
      c.fillStyle = '#94a3b8';
      c.beginPath(); c.arc(q[0], q[1], 2.8, 0, Math.PI * 2); c.fill();
    }
  }
  // 幽灵车
  if (mode === 'practice' && ghostData && ghostData.length){
    const g = ghostData[Math.min(gIdx, ghostData.length - 1)];
    if (g){
      const q = mmPx(g.x, g.z);
      c.fillStyle = 'rgba(125,211,252,.55)';
      c.beginPath(); c.arc(q[0], q[1], 2.6, 0, Math.PI * 2); c.fill();
    }
  }
  // 玩家箭头（发光效果）
  const q = mmPx(player.pos.x, player.pos.z);
  c.save();
  c.translate(q[0], q[1]);
  c.rotate(Math.PI / 2 - player.yaw);
  // 发光
  c.shadowColor = '#5eead4';
  c.shadowBlur = 8;
  c.beginPath(); c.moveTo(8, 0); c.lineTo(-5, 5); c.lineTo(-4, 0); c.lineTo(-5, -5); c.closePath();
  c.fillStyle = '#5eead4'; c.fill();
  c.shadowBlur = 0;
  c.restore();
}

/* ============ 主循环 ============ */
const clock = new THREE.Clock();
let menuAngle = 0, frameAcc = 0;
let hudTick = 0, shadowTick = 0;
// 实际帧率统计（与 settings.fps 上限无关）
let fpsFrames = 0, fpsLastMs = performance.now(), fpsCur = 0;
let fpsLowStreak = 0, fpsHighStreak = 0;
function tickFps(){
  fpsFrames++;
  const now = performance.now();
  if (now - fpsLastMs >= 1000){
    fpsCur = Math.round(fpsFrames * 1000 / (now - fpsLastMs));
    fpsFrames = 0; fpsLastMs = now;
    fpsInline.textContent = fpsCur + ' fps';
    fpsInline.style.color = fpsCur >= 55 ? '#4ade80' : fpsCur >= 30 ? '#fbbf24' : '#f87171';
    // 动态分辨率（仅移动端）：连续 3 秒低于 45fps → 渲染精度降 0.25（最低 1.0）；
    // 连续 8 秒满帧 → 升回来（最高 1.5）。以小幅牺牲清晰度保住流畅度。
    if (IS_MOBILE){
      if (fpsCur < 45){ fpsLowStreak++; fpsHighStreak = 0; }
      else if (fpsCur >= 57){ fpsHighStreak++; fpsLowStreak = 0; }
      else { fpsLowStreak = 0; fpsHighStreak = 0; }
      if (fpsLowStreak >= 3 && pixCap > 1.0){
        pixCap = Math.max(1.0, pixCap - 0.25); applyPixelRatio(); fpsLowStreak = 0;
      } else if (fpsHighStreak >= 8 && pixCap < 1.5){
        pixCap = Math.min(1.5, pixCap + 0.25); applyPixelRatio(); fpsHighStreak = 0;
      }
    }
  }
}
function loop(){
  requestAnimationFrame(loop);
  const raw = Math.min(clock.getDelta(), 0.25);   // 切后台/长卡顿保护
  const step = 1 / settings.fps;                  // 帧率上限：30/60/90
  frameAcc += raw;
  if (frameAcc < step - 0.001) return;            // 未到下一帧：不更新、不渲染
  frameAcc = frameAcc > step * 2.5 ? step : frameAcc - step; // 掉帧时丢弃积压，避免追帧
  const dt = step;
  try {
    if (state === 'countdown'){
      // 倒计时：首 1s 纯车辆展示，随后 3-2-1-GO 各 0.8s，期间锁定输入与物理
      countdownT -= dt;
      const t = Math.ceil(countdownT);
      if (t <= 3) flash(t > 0 ? String(t) : 'GO!', t === 1 ? 600 : 750);
      updateCountdownCamera();   // 绕车展示动画
      updateHUD();
      if (countdownT <= 0){
        state = 'running';
        countdownT = 0;
        // GO! 不再立刻熄灭：交给 flash 自己的定时器淡出，出弯时还看得到约 0.6s
      }
      renderer.render(scene, camera);
      tickFps();
      return;
    }
    if (state === 'running'){
      raceTime += dt;
      // 漂移防抖：更新缓冲状态后再读取输入
      if (isTouch) updateDriftDebounce(_driftRaw.pressed, dt);
      stepRacer(player, playerInput(), dt);
      if (mode === 'race'){
        for (const b of bots) stepRacer(b, aiControl(b), dt);
      } else if (!trackOpen){
        // 练习模式：录制本圈轨迹（0.1s 一帧，作幽灵数据）；超出上限停止录制防无限膨胀
        recTimer += dt;
        if (recTimer >= 0.1){
          recTimer = 0;
          if (ghostRec.length < MAX_GHOST_FRAMES){
            ghostRec.push({
              t: raceTime - player.lapStartTime,
              x: player.pos.x, z: player.pos.z, yaw: player.yaw
            });
          }
        }
      }
      collideRacers();
      if (mode === 'race') updateStandings();
      updateGhost();
      updateCamera(dt);
      // HUD 与小地图降频刷新：DOM 样式 / Canvas 2D 操作不必跟满 60fps
      // （速度表 20Hz、小地图 15Hz，肉眼无差异，样式开销降为 1/3~1/4）
      hudTick++;
      if (hudTick % 3 === 0) updateHUD();
      if (hudTick % 4 === 0) updateMinimap();
    } else if (state === 'menu'){
      const inGarage = (uiPanel === 'garage');
      menuAngle += dt * (inGarage ? 0.09 : 0.12);
      if (inGarage){
        camera.position.set(GARAGE_POS.x + Math.cos(menuAngle) * 13.5, 5.2, GARAGE_POS.z + Math.sin(menuAngle) * 13.5);
        camera.lookAt(GARAGE_POS.x, 1.2, GARAGE_POS.z);
        setFov(42);
        showcase.rotation.y += dt * 0.45; // 展台慢转
      } else {
        const mr = Math.min(trackRadius, 620);   // 长赛道限幅，避免镜头离得太远
        camera.position.set(
          trackCenter.x + Math.cos(menuAngle) * mr,
          mr * 0.46,
          trackCenter.z + Math.sin(menuAngle) * mr
        );
        camera.lookAt(trackCenter.x, 0, trackCenter.z);
        setFov(62);
      }
    }
    // 小地图始终显示，不随状态切换隐藏
    if (!mmShown){
      mmShown = true;
      mmCanvas.style.display = 'block';
    }
    // 阴影降频：菜单/暂停/结算画面场景近乎静止，每 4 帧更新一次阴影贴图
    // （省电 + 释放 GPU 给菜单动画）；比赛中恢复全速更新
    if (state === 'running' || state === 'countdown'){
      renderer.shadowMap.autoUpdate = true;
    } else {
      renderer.shadowMap.autoUpdate = false;
      if ((shadowTick++ & 3) === 0) renderer.shadowMap.needsUpdate = true;
    }
    renderer.render(scene, camera);
    tickFps();
  } catch (e) {
    showError('循环内异常：' + e.message);
    state = 'paused';
    // 必须把菜单弹出来：否则玩家面对一个静默冻结的画面无法操作
    resetAllInputs();
    try { showPanel('paused'); overlay.classList.remove('hidden'); } catch (_) {}
  }
}
// 初始化：只摆车做菜单背景，绝不自动开跑（restart 会把 state 设为 running）
placeRacerAt(player, 0, 2.5);
bots.forEach(b => { b.group.visible = false; });
if (settings.track && settings.track !== currentTrack) switchTrack(settings.track);
buildMinimap();          // 未切赛道时 switchTrack 不会触发，这里补一次
loadTrackRecords();
syncTrackUI();
initGarage(); // 车库展厅 + 各车型缩略图
refreshHomeInfo();
syncSettingsUI();
showPanel('home');
// 有未读新公告 → 首次进主菜单自动弹出
if (settings.seenUpdate !== UPDATE_VERSION) showPanel('update');
// 调试钩子：仅 ?debug=1 时暴露，用于 G4 性能门禁取值
if (new URLSearchParams(location.search).has('debug')){
  window.__dbg = { renderer, scene, player, P, CAR_TYPES, TRACK_DEFS };
}
loop();
}
</script>
