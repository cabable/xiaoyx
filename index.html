<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<!-- CDN 预连接：Three.js 约 600KB 是首屏加载大头，提前完成 DNS/TLS 可省数百毫秒 -->
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link rel="dns-prefetch" href="https://unpkg.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<title>街机赛车</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0e14;font-family:"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;}
  #hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);}
  /* 干净 HUD：零边框、淡角、只留必须的信息 */
  .hud-box{position:absolute;padding:10px 14px;background:rgba(10,14,20,.45);border-radius:12px;}
  #times{left:18px;top:16px;font-size:14px;line-height:1.9;color:#e2e8f0;}
  #times b{color:#7dd3fc;font-weight:600;font-variant-numeric:tabular-nums;}
  #times .label{color:#64748b;font-size:11px;}
  #speed{right:22px;bottom:18px;font-size:52px;font-weight:700;text-align:right;line-height:1;}
  #speed small{font-size:14px;font-weight:400;color:#94a3b8;margin-left:4px;}
  /* 速度感：屏幕暗角随车速加深；极速段速度表泛红发光 */
  #speedFx{position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at 50% 46%, transparent 46%, rgba(2,6,16,.62) 100%);}
  #speed #spd{transition:color .15s,text-shadow .15s;}
  #speed.hot #spd{color:#ff6b6b;text-shadow:0 0 16px rgba(255,107,107,.5);}
  #nitroBox{left:22px;bottom:22px;width:220px;}
  #nitroLabel{display:flex;justify-content:space-between;font-size:11px;color:#64748b;margin-bottom:4px;letter-spacing:1px;}
  #nitroPct{color:#7dd3fc;font-size:12px;}
  #nitroTrack{height:5px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;}
  #nitroFill{height:100%;width:100%;background:linear-gradient(90deg,#38bdf8,#22d3ee);border-radius:3px;transition:width .15s;}
  #drift{right:22px;bottom:96px;font-size:13px;color:#ffd479;opacity:0;transition:opacity .2s;font-weight:600;letter-spacing:1px;}
  #hint{left:50%;bottom:8px;transform:translateX(-50%);font-size:11px;color:#475569;white-space:nowrap;letter-spacing:.5px;}
  #msg{position:absolute;left:50%;top:12%;transform:translateX(-50%);font-size:28px;font-weight:700;opacity:0;transition:opacity .3s;text-align:center;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.9);}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(5,8,12,.92);color:#fff;gap:14px;padding-bottom:22px;}
  #overlay.hidden{display:none;}
  #overlay h1{margin:0;font-size:28px;text-shadow:0 2px 12px rgba(0,0,0,.9);}
  #overlay p{margin:0;color:#94a3b8;}
  #overlay button{pointer-events:auto;font-size:16px;padding:10px 28px;border-radius:8px;border:1px solid #38bdf8;background:#0ea5e9;color:#fff;cursor:pointer;}
  #overlay button:hover{background:#38bdf8;}
  #overlay button:disabled{background:#475569;border-color:#64748b;cursor:wait;}
  #menuBtns{display:flex;flex-direction:column;gap:10px;}
  /* 车库车辆网格：auto-fit 自适应列数，窄屏手机自动降为 2 列 / 1 列，不溢出 */
  #carBtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:9px;
    width:min(520px,calc(100vw - 40px));}
  #carBtns .car{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;padding:6px 6px;min-width:0;width:auto;}
  #carBtns .car .thumb{width:100%;max-width:112px;height:64px;object-fit:cover;border-radius:5px;background:#0e1319;border:1px solid rgba(255,255,255,.08);pointer-events:none;}
  #carBtns .car small{font-size:10.5px;color:#94a3b8;font-weight:400;pointer-events:none;}
  /* 被动技能小字 */
  #carBtns .car small.psk{font-size:10px;color:#ffd166;font-weight:600;letter-spacing:.2px;pointer-events:none;}
  #carBtns .car.active{background:#16a34a;border-color:#22c55e;}
  #carBtns .car.active small{color:#dcfce7;}
  #carBtns .car[data-car="apex"]{border-color:rgba(255,209,102,.55);}
  #carBtns .car[data-car="apex"] small{color:#ffd166;}
  #overlay button.mode{min-width:300px;max-width:calc(100vw - 40px);}
  #overlay p.small{font-size:13px;color:#64748b;text-align:center;line-height:1.7;}
  #menuMain{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;}
  #garagePanel{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;}
  #overlay .ghostbtn{background:transparent;border:1px solid #38bdf8;color:#7dd3fc;}
  #overlay .ghostbtn:hover{background:rgba(56,189,248,.16);}
  /* 竞技设置：分段选择按钮 */
  #racePanel,#practicePanel{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;}
  #diffBtns,#raceTrackBtns{display:flex;gap:6px;flex:1;}
  #overlay .opt{padding:7px 0;font-size:14px;flex:1;text-align:center;line-height:1.25;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#cbd5e1;border-radius:7px;}
  #overlay .opt small{display:block;font-size:10px;color:#64748b;font-weight:400;}
  #overlay .opt.active{background:#0ea5e9;border-color:#38bdf8;color:#fff;}
  #overlay .opt.active small{color:#dbeafe;}
  #overlay .opt:disabled{opacity:.4;cursor:not-allowed;}
  #settingsPanel{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;}
  /* 更新公告面板 */
  #updatePanel{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;}
  #updateList{width:calc(100vw - 48px);max-width:520px;max-height:52vh;overflow-y:auto;
    background:rgba(15,23,32,.65);border:1px solid rgba(255,255,255,.1);border-radius:10px;
    padding:12px 16px;text-align:left;}
  #updateList::-webkit-scrollbar{width:6px;}
  #updateList::-webkit-scrollbar-thumb{background:rgba(56,189,248,.4);border-radius:3px;}
  #updateList h3{margin:10px 0 4px;font-size:14px;color:#7dd3fc;}
  #updateList h3:first-child{margin-top:0;}
  #updateList li{font-size:13px;color:#cbd5e1;line-height:1.9;list-style:none;padding-left:14px;position:relative;}
  #updateList li::before{content:'·';position:absolute;left:2px;color:#38bdf8;font-weight:700;}
  #updateList .new-badge{display:inline-block;font-size:10px;background:#0ea5e9;color:#fff;
    border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px;}
  .dot-badge{position:absolute;top:2px;right:6px;width:8px;height:8px;border-radius:50%;
    background:#f87171;box-shadow:0 0 6px rgba(248,113,113,.8);}
  /* 清空缓存按钮（危险操作，红色描边，需点两次确认） */
  #overlay .dangerbtn{background:transparent;border:1px solid rgba(248,113,113,.55);color:#fca5a5;
    font-size:13px;padding:7px 16px;border-radius:8px;}
  #overlay .dangerbtn:hover{background:rgba(185,28,28,.28);border-color:rgba(248,113,113,.9);}
  #overlay .dangerbtn.armed{background:rgba(185,28,28,.55);border-color:#f87171;color:#fff;}
  #clearCacheMsg{font-size:12px;color:#7dd3fc;min-width:96px;text-align:left;}
  /* 窄屏（手机）设置行不撑破屏幕 */
  @media (max-width:560px){
    .setRow{min-width:0;width:calc(100vw - 36px);gap:10px;padding:10px 12px;}
    .setRow label{width:auto;font-size:13px;white-space:nowrap;}
    #clearCacheMsg{min-width:0;flex:1;font-size:11px;}
  }
  #overlay #settingsBtn{position:absolute;top:18px;right:22px;pointer-events:auto;font-size:14px;padding:7px 18px;
    background:rgba(10,14,20,.8);border:1px solid rgba(255,255,255,.15);color:#94a3b8;border-radius:8px;}
  #overlay #settingsBtn:hover{border-color:#38bdf8;color:#7dd3fc;}
  #hudExit{position:absolute;top:16px;right:20px;pointer-events:auto;font-size:12px;padding:5px 14px;
    background:rgba(10,14,20,.7);border:1px solid rgba(255,255,255,.12);color:#64748b;border-radius:7px;
    opacity:0;transition:opacity .3s,background .2s,box-shadow .2s;}
  #hudExit:hover{background:rgba(185,28,28,.35);color:#fca5a5;}
  /* HUD 面板通用样式 */
  .hud-panel{position:absolute;background:rgba(10,14,20,.6);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:8px 12px;color:#e2e8f0;font-size:14px;font-variant-numeric:tabular-nums;}
  .hud-panel .lbl{color:#64748b;font-size:11px;margin-right:6px;}
  .hud-panel b{color:#7dd3fc;font-weight:600;}
  #fpsInline{font-size:11px;color:#475569;margin-top:8px;}
  #times{left:18px;top:16px;line-height:1.8;}
  #speed{right:22px;bottom:18px;font-size:48px;font-weight:700;text-align:right;padding:6px 16px;}
  #speed small{font-size:13px;font-weight:400;color:#94a3b8;margin-left:3px;}
  #nitroBox{left:22px;bottom:22px;width:200px;padding:7px 11px;}
  .nitro-hdr{display:flex;justify-content:space-between;font-size:11px;color:#64748b;margin-bottom:4px;}
  #nitroPct{color:#7dd3fc;}
  .nitro-track{height:4px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden;}
  #nitroFill{height:100%;width:100%;background:linear-gradient(90deg,#38bdf8,#22d3ee);border-radius:2px;}
  #drift{right:22px;bottom:84px;font-size:13px;color:#ffd479;font-weight:600;letter-spacing:.5px;padding:6px 11px;}
  #hint{left:50%;bottom:8px;transform:translateX(-50%);font-size:11px;color:#475569;white-space:nowrap;letter-spacing:.5px;padding:5px 14px;}
  #msg{position:absolute;left:50%;top:12%;transform:translateX(-50%);max-width:80vw;font-size:26px;font-weight:700;opacity:0;transition:opacity .25s;text-align:center;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.9);padding:8px 20px;}
  /* 必须 absolute：只写 left/top 而无 position 时会被当成普通块元素排到 (0,0)，压住 #times */
  #minimap{position:absolute;z-index:2;left:18px;top:90px;width:150px;height:150px;border-radius:10px;border:2px solid rgba(255,255,255,.2);background:rgba(10,14,20,.7);opacity:.95;box-shadow:0 2px 8px rgba(0,0,0,.5);}
  #pausePanel{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;}
  #overlay #settingsBtn:hover{border-color:#38bdf8;color:#7dd3fc;background:rgba(14,165,233,.18);}
  .menuRow{display:flex;gap:10px;justify-content:center;}
  .trackRow{display:flex;align-items:center;gap:10px;margin:6px 0;}
  .trackLabel{font-size:12px;color:#64748b;letter-spacing:1px;}
  #trackBtns{display:flex;gap:6px;flex:1;}
  #practicePanel #trackBtns .trk{flex:1;padding:8px 0;border-radius:7px;}
  #trackBtns .trk{font-size:13px;padding:5px 14px;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.15);color:#cbd5e1;border-radius:7px;}
  #trackBtns .trk.active{background:#0ea5e9;border-color:#38bdf8;color:#fff;}
  .setRow{display:flex;align-items:center;gap:14px;background:rgba(15,23,32,.65);border:1px solid rgba(255,255,255,.1);
    border-radius:10px;padding:10px 16px;min-width:420px;}
  .setRow label{width:84px;font-size:14px;color:#cbd5e1;}
  .setVal{width:52px;text-align:right;font-size:14px;color:#7dd3fc;font-variant-numeric:tabular-nums;}
  #fpsBtns,#fpsShowBtns{display:flex;gap:6px;flex:1;}
  #fpsBtns .fps,#fpsShowBtns .fps{padding:5px 0;font-size:14px;flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#cbd5e1;}
  #fpsBtns .fps.active,#fpsShowBtns .fps.active{background:#16a34a;border-color:#22c55e;color:#fff;}
  #menuResult{flex-direction:column;align-items:center;gap:14px;width:100%;}
  #resultList{list-style:none;margin:0;padding:0;text-align:left;font-size:17px;line-height:2.1;}
  #resultList .chip{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:10px;vertical-align:-1px;}
  #resultList .me{color:#7dd3fc;font-weight:700;}
  #resultBtns{display:flex;gap:12px;}
  #err{position:fixed;left:0;right:0;bottom:0;background:#7f1d1d;color:#fff;padding:10px 16px;font:13px/1.5 Consolas,monospace;display:none;white-space:pre-wrap;z-index:99;}
  /* 手机触控层 */
  #touchLayer{position:fixed;inset:0;pointer-events:none;z-index:50;display:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #touchLayer.on{display:block;}
  .touch-zone{position:absolute;pointer-events:auto;touch-action:none;}
  /* 手机端全局消除点击延迟 */
  button, a, [role="button"]{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}

  /* ── 左拇指：左右箭头转向（参考 QQ 飞车）── */
  #btnLeft,#btnRight{
    width:96px;height:96px;font-size:40px;line-height:1;
    background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.45);
    color:#e2e8f0;border-radius:18px;
  }
  #btnLeft{left:16px;bottom:20px;}
  #btnRight{left:122px;bottom:20px;}
  #btnLeft.pressed,#btnRight.pressed{
    background:rgba(56,189,248,.55);border-color:#38bdf8;
    box-shadow:0 0 20px rgba(56,189,248,.6);
  }

  /* ── 右拇指：垂直一列（油门→刹车→漂移→氮气→极限）── */
  .btn-r{
    position:absolute;display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;
    text-shadow:0 1px 4px rgba(0,0,0,.9);
    transition:transform .06s,filter .06s,box-shadow .06s;
  }
  .btn-r.pressed{transform:scale(.9);filter:brightness(1.4);}

  /* 油门：最大，绿色，最显眼（QQ 飞车风格） */
  #btnThrottle{
    width:96px;height:96px;font-size:28px;
    right:16px;bottom:20px;
    background:linear-gradient(145deg,rgba(34,197,94,.82),rgba(22,163,74,.82));
    border:3px solid rgba(74,222,128,.95);
    border-radius:20px;
    box-shadow:0 4px 18px rgba(34,197,94,.35);
  }
  #btnThrottle.pressed{box-shadow:0 0 28px rgba(34,197,94,.75);}

  /* 刹车：次大，红色 */
  #btnBrake{
    width:82px;height:82px;font-size:24px;
    right:120px;bottom:20px;
    background:linear-gradient(145deg,rgba(239,68,68,.78),rgba(220,38,38,.78));
    border:3px solid rgba(248,113,113,.95);
    border-radius:18px;
    box-shadow:0 4px 16px rgba(239,68,68,.3);
  }
  #btnBrake.pressed{box-shadow:0 0 26px rgba(239,68,68,.7);}

  /* 漂移：黄色，上方 */
  #btnDrift{
    width:72px;height:72px;font-size:16px;
    right:126px;bottom:114px;
    background:linear-gradient(145deg,rgba(234,179,8,.72),rgba(202,138,4,.72));
    border:2px solid rgba(251,191,36,.9);
    border-radius:16px;
    box-shadow:0 3px 14px rgba(234,179,8,.3);
  }
  #btnDrift.pressed{box-shadow:0 0 22px rgba(234,179,8,.7);}

  /* 氮气：蓝色，上方 */
  #btnNitro{
    width:82px;height:82px;font-size:18px;
    right:16px;bottom:118px;
    background:linear-gradient(145deg,rgba(14,165,233,.72),rgba(2,132,199,.72));
    border:2px solid rgba(56,189,248,.9);
    border-radius:18px;
    box-shadow:0 3px 14px rgba(14,165,233,.3);
  }
  #btnNitro.spraying{
    background:linear-gradient(145deg,rgba(103,232,249,.95),rgba(6,182,212,.95));
    border-color:#a5f3fc;
    box-shadow:0 0 28px rgba(103,232,249,.8);
  }
  #btnNitro.pressed{box-shadow:0 0 22px rgba(14,165,233,.7);}

  /* 极限突破：紫色，最上方 */
  #btnBoost{
    width:60px;height:60px;font-size:13px;
    right:22px;bottom:208px;
    background:linear-gradient(145deg,rgba(139,92,246,.7),rgba(109,40,217,.7));
    border:2px solid rgba(168,85,247,.88);
    border-radius:14px;
    box-shadow:0 3px 12px rgba(139,92,246,.3);
  }
  #btnBoost.pressed{box-shadow:0 0 20px rgba(139,92,246,.7);}

  /* 灵敏度滑条 */
  #sensSlider{flex:1;min-width:120px;height:6px;-webkit-appearance:none;appearance:none;
    background:linear-gradient(90deg,#38bdf8,#22d3ee);border-radius:3px;outline:none;cursor:pointer;}
  #sensSlider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;
    border-radius:50%;background:#e2e8f0;border:3px solid #38bdf8;box-shadow:0 2px 8px rgba(0,0,0,.5);}
  #sensSlider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#e2e8f0;
    border:3px solid #38bdf8;box-shadow:0 2px 8px rgba(0,0,0,.5);}

  /* 布局预设按钮 */
  .layout-opt{padding:5px 14px;font-size:13px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#cbd5e1;border-radius:7px;cursor:pointer;flex:1;text-align:center;}
  .layout-opt.active{background:#0ea5e9;border-color:#38bdf8;color:#fff;}
  #layoutRow .setVal{font-size:11px;color:#64748b;width:auto;flex:1;}

  /* 布局编辑模式：按钮加虚线框，方便辨认可拖动 */
  #touchLayer.editing .touch-zone{outline:2px dashed rgba(56,189,248,.9);outline-offset:2px;opacity:.95;}
  #touchLayer.editing{background:rgba(10,14,20,.55);}
  #layoutEditBar{display:none;position:absolute;top:8px;left:50%;transform:translateX(-50%);
    padding:8px 18px;border-radius:999px;background:rgba(10,14,20,.9);
    border:1px solid rgba(56,189,248,.6);color:#7dd3fc;font-size:13px;letter-spacing:1px;
    white-space:nowrap;pointer-events:auto;z-index:60;cursor:pointer;}
  #touchLayer.editing #layoutEditBar{display:block;}

  /* 竖屏提示：角标 + 点击进入全屏 */
  #rotateHint{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    padding:12px 24px;border-radius:16px;background:rgba(10,14,20,.92);
    border:1px solid rgba(56,189,248,.5);color:#7dd3fc;font-size:14px;
    white-space:nowrap;pointer-events:auto;z-index:80;text-align:center;cursor:pointer;
    user-select:none;-webkit-tap-highlight-color:transparent;
    box-shadow:0 0 20px rgba(56,189,248,.3);}
  #rotateHint:active{background:rgba(56,189,248,.3);}
  #rotateHint .rt-icon{font-size:28px;display:block;margin-bottom:4px;}
  #rotateHint .rt-sub{font-size:11px;color:#94a3b8;display:block;margin-top:2px;}
  body.touch-ui.portrait #rotateHint{display:flex;flex-direction:column;align-items:center;}
  /* 触屏设备不显示键盘提示条 */
  body.touch-ui #hint{display:none;}
  /* 漂移提示移到顶部居中 */
  body.touch-ui #drift{top:8px;left:50%;right:auto;bottom:auto;transform:translateX(-50%);}
  /* ── 横屏适配 ── */
  @media (orientation:landscape){
    body.touch-ui #times{top:8px;left:10px;font-size:12px;line-height:1.55;padding:6px 9px;}
    body.touch-ui #times .lbl{font-size:10px;}
    body.touch-ui #minimap{top:62px;left:12px;width:104px;height:104px;border-radius:8px;}
    body.touch-ui #nitroBox{top:174px;bottom:auto;left:12px;width:150px;padding:5px 9px;}
    body.touch-ui #speed{left:50%;right:auto;transform:translateX(-50%);bottom:8px;
      font-size:36px;padding:2px 14px;}
    body.touch-ui #speed small{font-size:12px;}
    body.touch-ui #drift{font-size:11px;padding:4px 9px;}
  }
  @media (orientation:landscape) and (max-height:400px){
    body.touch-ui #times{font-size:11px;line-height:1.45;}
    body.touch-ui #minimap{width:92px;height:92px;top:58px;}
    body.touch-ui #nitroBox{top:158px;width:136px;}
    body.touch-ui #speed{font-size:30px;}

<script type="module">
/* ============ 错误处理（必须最先定义，供加载失败时使用） ============ */
const errBox = document.getElementById('err');
function showError(msg){
  errBox.style.display = 'block';
  errBox.textContent = '[错误] ' + msg;
}
window.addEventListener('error', e => showError(e.message || '未知错误'));
window.addEventListener('unhandledrejection', e => showError(String(e.reason)));

/* 多 CDN 动态加载 Three.js（自动降级，避免单一 CDN 被墙导致整个游戏无法启动） */
let THREE = null;
const menuBtns = Array.from(document.querySelectorAll('#overlay button.mode, #overlay button.car, #overlay button.ghostbtn') || []);
/* 设备判定（渲染器初始化前就需要）：
 * IS_TOUCH 只管"是否启用触控操作"；IS_MOBILE 管渲染画质，用 UA 识别，
 * 避免把带触屏的 Windows 笔记本也当成手机降画质。iPadOS 桌面 UA 单独识别。 */
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const IS_MOBILE = /Android|iPhone|iPod|Mobile|Silk/i.test(navigator.userAgent)
  || (navigator.maxTouchPoints > 1 && /iPad|Macintosh/.test(navigator.userAgent));
console.log('[街机赛车] 版本 v20261029');
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout ' + ms + 'ms')), ms))]);
// THREE 未就绪前锁定菜单按钮：点了也不会有反应（事件在 initGame 里才绑定），不如明确禁用
menuBtns.forEach(b => b.disabled = true);
(async function() {
  try {
    const THREE_CDNS = [
      'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js',
      'https://unpkg.com/three@0.160.0/build/three.module.js',
      'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'
    ];
    for (const url of THREE_CDNS){
      try {
        THREE = await withTimeout(import(url), 12000);
        break;
      } catch (e) { /* 换下一个源 */ }
    }
    if (!THREE){
      throw new Error('THREE load failed');
    }
    initGame();
  } catch (e) {
    showError(e.message);
  } finally {
    menuBtns.forEach(b => b.disabled = false);
  }
})();
function initGame() {

/* ============ 可调参数（调参看这里） ============ */
const P = {
  // --- 纵向动力（玩家与 AI 共用同一套物理） ---
  accel: 28,          // 油门加速度 m/s^2（随速度线性衰减）
  maxSpeed: 83.3,     // 基础峰值参考 m/s（=300km/h，仅用于转向衰减归一化）
  PEAK_SPEED: 100,    // 全局硬峰值 m/s（=360km/h，普通驾驶无法突破，仅氮气和极限可越过）
  brake: 40,          // 刹车减速度
  reverseAccel: 10,   // 倒车加速度
  maxReverse: 12,     // 倒车极速
  drag: 0.05,         // 空气阻力系数（0.05：极速300km/h 时仍可全速到达）
  rolling: 0.5,       // 滚动阻力 m/s^2
  // offDrag（草地衰减）已删除：护栏保证车无法冲出赛道
  // --- 横向 / 漂移 ---
  grip: 22.0,           // 正常抓地（加大：300km/h 也贴地）
  driftGrip: 3.5,       // 漂移侧向抓地（中等：有阻力感，不会太飘）
  driftScrub: 0.65,     // 漂移蹭速：中等偏高（保持速度感的同时有拖拽感）
  driftSteerBoost: 1.4, // 漂移时转向力放大（保留一定灵活性但有阻力）
  driftYawCap: 2.0,     // 漂移偏转率封顶（适中，不会太猛）
  steerRate: 3.2,       // 基础最大转向角速度
  steerRef: 35,         // 达到满舵所需速度 m/s
  steerFade: 0.25,      // 高速转向衰减比例（再降：300km/h 仍有 75% 转向效率）
  driftMinTime: 0.8,    // 判定"完美"所需最短漂移秒数
  driftSlipMin: 0.5,    // 侧滑门槛（更低：更容易触发侧滑感知）
  driftMinSpeed: 3,     // 漂移判定最低车速（更低：低速也能漂移）
  boostGain: 1.15,      // 完美漂移补偿：速度 ×1.15（补偿掉的速度）
  boostDuration: 2.5,   // 补偿加速持续秒数
  // --- 相机 ---
  camDist: 15.5, camHeight: 4.5, camLerp: 5.0, lookAhead: 7,
  // --- 表现 ---
  roll: 0.12,         // 过弯侧倾 rad（峰值）
  // --- 碰撞 ---
  colRadius: 1.1,     // 默认碰撞半径（实际按各车型车宽 ×0.6 计算，见 applyCarDims）
  colOffset: 1.1,     // 默认碰撞圆偏移（实际按各车型车长 ×0.25 计算）
  colBounce: 0.35,    // 碰撞弹性（0=完全粘滞，1=完全弹性）
  // --- 氮气（玩家专属） ---
  nitroGain: 1.25,     // 极速上限倍率
  nitroAccelMul: 1.8,  // 加速度倍率
  nitroDrain: 42,      // 每秒消耗（满瓶约 2.4s）
  nitroRegen: 7,       // 每秒自动回充
  nitroDriftGain: 16,  // 漂移时额外充能
  nitroMin: 6,         // 低于此储量无法启动
  // --- 极限突破（Ctrl / X：速度上限 +100%，3 秒，冷却 12 秒） ---
  overGain: 2.0,       // 极速上限倍率（+100%）
  overAccelMul: 1.5,   // 加速度倍率
  overDuration: 3,     // 持续秒数
  overCooldown: 12,    // 冷却秒数
  // --- AI ---
  aiSteerGain: 2.2,   // AI 转向比例增益
  aiLookBase: 14,     // AI 前视基础采样数
  aiLookSpeed: 0.5,   // AI 前视随速度增长（采样/米）
  aiCornerGain: 1.1,  // AI 弯道减速灵敏度
  aiStuckTime: 3      // AI 卡死判定秒数
};

let selectedCar = 'default';
let uiPanel = 'home'; // home | garage | result
const TRACK_W = 25;   // 路面加宽：20→25m，容错空间更大
const N_SAMPLES = 1800;                 // 采样随地图加长加密（2.5km 老街 → 约1.4m/采样点）
const CP_FRACS = [0, 0.25, 0.5, 0.75];
const CP_WINDOW = 0.02;
const bestKey = () => 'arcadeRacerBest:' + currentTrack + ':r' + (TRACK_DEFS[currentTrack].rev || 1);
const TOTAL_LAPS = 3;         // 竞技模式比赛圈数
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrapAngle = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };

/* ============ 渲染器 / 场景 ============ */
let renderer, scene, camera, dirLight;
try {
  renderer = new THREE.WebGLRenderer({
    antialias: !IS_MOBILE,            // 移动端关 MSAA：省下的填充率对帧率的贡献远大于锯齿感知
    powerPreference: 'high-performance'
  });
} catch (e) {
  showError('无法创建 WebGL 上下文，请检查浏览器是否支持 WebGL / 硬件加速。');
  throw e;
}
// 动态分辨率：移动端初始 1.5 倍像素比（DPR=3 的屏少算一半以上像素），帧率不足自动降档
let pixCap = IS_MOBILE ? 1.5 : 2;
const applyPixelRatio = () => renderer.setPixelRatio(Math.min(devicePixelRatio, pixCap));
renderer.setSize(innerWidth, innerHeight);
applyPixelRatio();
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = IS_MOBILE ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
renderer.domElement.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  showError('WebGL 上下文丢失，请刷新页面。');
});

scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 300, 950);

camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 1500);

// FOV 仅在变化时重算投影矩阵（固定机位下每帧 updateProjectionMatrix 是无谓开销）
let _lastFov = 62;
function setFov(f){
  if (f !== _lastFov){ _lastFov = f; camera.fov = f; camera.updateProjectionMatrix(); }
}

scene.add(new THREE.HemisphereLight(0xbfd9ff, 0x3f5a36, 0.9));
dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
dirLight.position.set(40, 70, 20);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(IS_MOBILE ? 512 : 1024, IS_MOBILE ? 512 : 1024);   // 移动端阴影贴图减半：阴影渲染量降到 1/4
dirLight.shadow.camera.left = -55; dirLight.shadow.camera.right = 55;
dirLight.shadow.camera.top = 55;   dirLight.shadow.camera.bottom = -55;
dirLight.shadow.camera.near = 1;   dirLight.shadow.camera.far = 260;
scene.add(dirLight, dirLight.target);

function onResize(){
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  applyPixelRatio();

    const b = S[trackOpen ? Math.max(i - 1, 0) : (i - 1 + N_SAMPLES) % N_SAMPLES];

  }
  // 曲率表（供 AI 反解过弯速度）
  trackLenValue = curve.getLength();
  const dsPer = trackLenValue / N_SAMPLES;
  for (let i = 0; i < N_SAMPLES; i++){

    const b = trackOpen ? T[Math.min(i + 1, N_SAMPLES - 1)] : T[(i + 1) % N_SAMPLES];

// 沿采样带生成一条 ribbon 网格（i0..i1 含端点；闭合传 0..N-1）
function buildStrip(i0, i1, o1, o2, y, mat){
  const count = i1 - i0 + 1;
  const pos = new Float32Array(count * 2 * 3);
  const uvArr = new Float32Array(count * 2 * 2);
  for (let k = 0; k < count; k++){
    const i = i0 + k, p = S[i], t = T[i];
    const sx = t.z, sz = -t.x; // 切线左侧法向
    pos[k*6+0] = p.x + sx*o1; pos[k*6+1] = y; pos[k*6+2] = p.z + sz*o1;
    pos[k*6+3] = p.x + sx*o2; pos[k*6+4] = y; pos[k*6+5] = p.z + sz*o2;
    const u = i / 7;
    uvArr[k*4+0] = u; uvArr[k*4+1] = 0;
    uvArr[k*4+2] = u; uvArr[k*4+3] = 3;
  }
  const idx = [];
  for (let k = 0; k < count - 1; k++){
    const a = k*2, b = a+1, c = (k+1)*2, d = c+1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uvArr, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return new THREE.Mesh(g, mat);
}

{

  frame.position.set(p.x, 6.7, p.z);
  frame.rotation.y = Math.atan2(t.x, t.z);
  trackGroup.add(frame);
  // 黑白格：两行 12 列
  const cellW = bannerW / 12;
  const cellGeo = new THREE.BoxGeometry(cellW, 0.4, 0.04);
  const black = new THREE.MeshBasicMaterial({ color: 0x0d1116 });
  const white = new THREE.MeshBasicMaterial({ color: 0xf2f5f8 });
  const cosY = Math.cos(frame.rotation.y), sinY = Math.sin(frame.rotation.y);
  for (let row = 0; row < 2; row++){
    for (let col = 0; col < 12; col++){
      const lx = -bannerW / 2 + cellW * (col + 0.5);
      const cell = new THREE.Mesh(cellGeo, (row + col) % 2 ? black : white);
      cell.position.set(
        p.x + lx * cosY, 6.7 + (row - 0.5) * 0.42, p.z - lx * sinY + 0.08
      );
      cell.rotation.y = frame.rotation.y;
      trackGroup.add(cell);
    }
  }
}

// —— 环境装饰（全部 InstancedMesh 合批，切换赛道时整体重建） ——
const decorMeshes = [];
function clearDecor(){
  while (decorMeshes.length){
    const m = decorMeshes.pop();
    scene.remove(m);
    if (m.geometry) m.geometry.dispose();
    if (m.material) m.material.dispose();
  }
}
function addInstanced(geo, items, opts = {}){
  const mat = new THREE.MeshLambertMaterial({ color: 0xffffff });
  const im = new THREE.InstancedMesh(geo, mat, items.length);
  const d = new THREE.Object3D();
  const c = new THREE.Color();
  items.forEach((it, i) => {
    d.position.set(it.x, it.y, it.z);
    d.rotation.set(it.rx || 0, it.ry || 0, it.rz || 0);
    d.scale.set(it.sx ?? 1, it.sy ?? 1, it.sz ?? 1);
    d.updateMatrix();
    im.setMatrixAt(i, d.matrix);
    if (it.c != null) im.setColorAt(i, c.setHex(it.c));
  });
  im.instanceMatrix.needsUpdate = true;
  if (im.instanceColor) im.instanceColor.needsUpdate = true;
  im.castShadow = !!opts.castShadow;
  scene.add(im);
  decorMeshes.push(im);
  return im;
}

function buildDecor(){
  clearDecor();

// 灌木与岩石
{
  let seed = 31;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const bushes = [], rocks = [];
  let placed = 0, tries = 0;
  while (placed < 90 && tries < 900){
    tries++;
    const x = (rnd() - 0.5) * 640, z = (rnd() - 0.5) * 640;
    let ok = true;
    for (let i = 0; i < N_SAMPLES; i += 6){
      const dx = x - S[i].x, dz = z - S[i].z;
      if (dx * dx + dz * dz < (hw + 3) * (hw + 3)) { ok = false; break; }
    }
    if (!ok) continue;
    if (rnd() < 0.62){
      bushes.push({ x, y: 0.22, z, sx: 0.9 + rnd() * 1.6, sy: 0.45 + rnd() * 0.5, sz: 0.9 + rnd() * 1.6,
        c: rnd() > 0.5 ? 0x397a3c : 0x2d6b32 });
    } else {
      const sc = 0.35 + rnd() * 0.85;
      rocks.push({ x, y: 0.12, z, sx: sc, sy: sc * (0.6 + rnd() * 0.5), sz: sc * (0.8 + rnd() * 0.4),
        rx: rnd() * 3, ry: rnd() * 3, rz: rnd() * 3, c: 0x8b8f93 });
    }
    placed++;
  }
  addInstanced(new THREE.SphereGeometry(1, 7, 5), bushes);
  addInstanced(new THREE.IcosahedronGeometry(1, 0), rocks);
}

// 远山
{
  let seed = 71;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const items = [];
  for (let i = 0; i < 16; i++){
    const a = (i / 16) * Math.PI * 2 + rnd() * 0.2;
    const r = 560 + rnd() * 220;
    const h = 70 + rnd() * 90;
    const mx = Math.cos(a) * r + 20, mz = Math.sin(a) * r + 60;
    const sx = 60 + rnd() * 70, sz = 60 + rnd() * 70;
    const col = rnd() > 0.5 ? 0x6b7f8c : 0x5a6d79;
    // 山体可能压在赛道上（尤其直线图），太近就跳过
    let tooClose = false;
    for (let k = 0; k < N_SAMPLES; k += 10){
      if (Math.hypot(mx - S[k].x, mz - S[k].z) < Math.max(sx, sz) * 1.15 + 40){ tooClose = true; break; }
    }
    if (tooClose) continue;
    items.push({ x: mx, y: h / 2 - 4, z: mz, sx, sy: h, sz, c: col });
  }
  addInstanced(new THREE.ConeGeometry(1, 1, 5), items);
}

// 广告牌 + 支柱 + 轮胎堆
{
  const palette = [0x22d3ee, 0xffd166, 0xef476f, 0x06d6a0, 0x8338ec];
  const boards = [], legs = [], tyres = [];
  const step = Math.floor(N_SAMPLES / 18);
  for (let i = 0, k = 0; i < N_SAMPLES; i += step, k++){
    const p = S[i], t = T[i], sx = t.z, sz = -t.x;
    const side = k % 2 === 0 ? 1 : -1;
    const bx = p.x + sx * (hw + 4.2) * side;
    const bz = p.z + sz * (hw + 4.2) * side;
    const ry = Math.atan2(t.x, t.z) + Math.PI / 2;
    boards.push({ x: bx, y: 1.5, z: bz, ry, c: palette[k % palette.length] });
    for (const off of [-1.4, 1.4]){
      legs.push({ x: bx + Math.cos(ry) * off, y: 0.45, z: bz - Math.sin(ry) * off, c: 0x2b3138 });
    }
  }
  const tstep = Math.floor(N_SAMPLES / 12);
  for (let i = tstep; i < N_SAMPLES; i += tstep){
    const p = S[i], t = T[i], sx = t.z, sz = -t.x;
    const side = (i % (tstep * 2) === 0) ? 1 : -1;
    const bx = p.x + sx * (hw + 2.6) * side;
    const bz = p.z + sz * (hw + 2.6) * side;
    for (let s = 0; s < 3; s++) tyres.push({ x: bx, y: 0.18 + s * 0.3, z: bz, rx: Math.PI / 2, c: 0x1b1f24 });
  }
  addInstanced(new THREE.BoxGeometry(4.2, 1.15, 0.14), boards);
  addInstanced(new THREE.BoxGeometry(0.1, 0.9, 0.1), legs);
  addInstanced(new THREE.TorusGeometry(0.42, 0.16, 6, 12), tyres, { castShadow: true });
}

// 低多边形树木（InstancedMesh 合批：树干 + 树冠各一次绘制）
{
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const trunks = [], leaves = [], crowns = [], broad = [];
  let placed = 0, tries = 0;
  while (placed < 140 && tries < 1200){
    tries++;
    const x = (rnd() - 0.5) * 620, z = (rnd() - 0.5) * 620;
    let ok = true;
    for (let i = 0; i < N_SAMPLES; i += 4){
      const dx = x - S[i].x, dz = z - S[i].z;
      if (dx * dx + dz * dz < (hw + 6) * (hw + 6)) { ok = false; break; }
    }
    if (!ok) continue;
    const sc = 0.7 + rnd() * 0.8;
    const kind = rnd();
    trunks.push({ x, y: 0.8 * sc, z, sx: sc, sy: sc, sz: sc, c: 0x7a5230 });
    if (kind < 0.55){
      // 塔松：两层锥体
      leaves.push({ x, y: 3.0 * sc, z, sx: sc, sy: sc, sz: sc, c: 0x2f7d32 });
      crowns.push({ x, y: 4.9 * sc, z, sx: sc * 0.66, sy: sc * 0.7, sz: sc * 0.66, c: 0x367f39 });
    } else {
      // 阔叶：压扁球体树冠
      broad.push({ x, y: 3.4 * sc, z, sx: 1.9 * sc, sy: 1.5 * sc, sz: 1.9 * sc,
        c: kind > 0.8 ? 0x3f8f43 : 0x357a3a });
    }
    placed++;
  }
  addInstanced(new THREE.CylinderGeometry(0.25, 0.35, 1.6, 6), trunks);
  addInstanced(new THREE.ConeGeometry(1.7, 4.2, 6), leaves, { castShadow: true });
  addInstanced(new THREE.ConeGeometry(1.7, 4.2, 6), crowns, { castShadow: true });
  addInstanced(new THREE.SphereGeometry(1.6, 8, 6), broad, { castShadow: true });
}

  skidIdx[o] = b;     skidIdx[o+1] = b+1; skidIdx[o+2] = b+2;

  color: 0x0a0c10, transparent: true, opacity: 0.42, depthWrite: false, side: THREE.DoubleSide

let skidHead = 0, skidCount = 0;

function addSkidSegment(x1, z1, x2, z2, halfW){
  let dx = x2 - x1, dz = z2 - z1;
  const len = Math.hypot(dx, dz);
  if (len < 1e-4) return;
  dx /= len; dz /= len;
  const nx = -dz * halfW, nz = dx * halfW;
  const b = skidHead * 12, y = 0.055;
  skidPos[b+0] = x1 + nx; skidPos[b+1] = y;  skidPos[b+2] = z1 + nz;
  skidPos[b+3] = x1 - nx; skidPos[b+4] = y;  skidPos[b+5] = z1 - nz;
  skidPos[b+6] = x2 + nx; skidPos[b+7] = y;  skidPos[b+8] = z2 + nz;
  skidPos[b+9] = x2 - nx; skidPos[b+10] = y; skidPos[b+11] = z2 - nz;
  skidGeo.attributes.position.needsUpdate = true;
  skidHead = (skidHead + 1) % SKID_MAX;
  skidCount = Math.min(skidCount + 1, SKID_MAX);
  skidGeo.setDrawRange(0, skidCount * 6);
}
function clearSkid(){
  skidHead = 0; skidCount = 0;
  skidGeo.setDrawRange(0, 0);
}

// 侧视轮廓挤出成型（x=车长, y=高度 → 沿车宽方向挤出）
function extrudeProfile(pts, width){
  const shape = new THREE.Shape();
  shape.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) shape.lineTo(pts[i][0], pts[i][1]);
  shape.closePath();
  const g = new THREE.ExtrudeGeometry(shape, {
    depth: width, bevelEnabled: true,
    bevelThickness: 0.05, bevelSize: 0.06, bevelSegments: 2
  });
  g.translate(0, 0, -width / 2);
  g.rotateY(-Math.PI / 2); // 车头朝 +z
  g.computeVertexNormals();
  return g;
}

    lightF: [0.76, 2.42], lightR: [0.9, -2.46], exhaust: [0.3, -2.48],
    scoop: null, splitter: false, roofRack: false, sideSteps: false
  }
};
/* ============ 被动技能：每台车一条专属特性（参考 QQ 飞车的"赛车特性"） ============
 * 全部做成"乘子"，只调已经存在的物理参数，不改物理流程本身。
 * 用法：以 skOf(车型) 取到一份完整参数，物理里按 r.sk.xxx 乘进对应项。 */
const PASSIVE_DEFAULTS = {
  lowAccel: 1,      // 低速段（< 10 m/s）加速度倍率
  nitroRegen: 1,    // 松开氮气时的回充倍率
  nitroDrain: 1,    // 氮气消耗倍率（越小越省）
  nitroDrift: 1,    // 漂移集气倍率
  grip: 1,          // 常规抓地倍率（不含漂移）
  boostDur: 1,      // 完美漂移加速时长倍率
  overCd: 1,        // 极限突破冷却倍率
  taperEnd: 0.85,   // 加速衰减起点：越大越晚衰减（高速仍有力）
  brakeRegen: 1     // 刹车时氮气回充倍率（动能回收）
};
const skOf = key => Object.assign({}, PASSIVE_DEFAULTS,
  (((CAR_TYPES[key] || CAR_TYPES.default).passive || {}).mods) || {});

/* ============ 车辆贴图（Canvas 程序化生成，零外部资源） ============ */
const maxAniso = renderer.capabilities.getMaxAnisotropy();

// UV 归一化：ExtrudeGeometry 端盖 UV 是「形状坐标」(x=车长, y=车高)，
// 必须用轮廓点范围归一，不能用旋转后几何的包围盒（那是车宽 × 车高，会错位）
function normalizeUVs(geo, minX, maxX, minY, maxY){
  const sx = (maxX - minX) || 1, sy = (maxY - minY) || 1;
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++){
    uv.setXY(i, (uv.getX(i) - minX) / sx, (uv.getY(i) - minY) / sy);
  }
  uv.needsUpdate = true;
}

// 车绘：底漆 + 金属漆颗粒 + 贯穿双条纹 + 车号圆标 + 裙边 + 面板缝
// 画布横向 = 车长（左=车尾，右=车头），纵向 = 车高（下=车底）
function makeLiveryTexture(color, num, stripeHex){
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  const hex = '#' + color.toString(16).padStart(6, '0');
  g.fillStyle = hex;
  g.fillRect(0, 0, 1024, 512);
  // 金属漆颗粒
  for (let i = 0; i < 4200; i++){
    g.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.06).toFixed(3) + ')';
    g.fillRect(Math.random() * 1024, Math.random() * 512, 1.6, 1.6);
  }
  // 漆面光泽渐变
  const grad = g.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0, 'rgba(255,255,255,0.12)');
  grad.addColorStop(0.55, 'rgba(255,255,255,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.22)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 1024, 512);
  // 贯穿双条纹（腰线高度）
  g.fillStyle = stripeHex;
  g.fillRect(0, 232, 1024, 24);
  g.fillRect(0, 270, 1024, 24);
  // 裙边
  g.fillStyle = 'rgba(10,14,20,0.6)';
  g.fillRect(0, 452, 1024, 60);
  // 车号圆标（后侧 1/4 处）
  g.beginPath();
  g.arc(455, 250, 58, 0, Math.PI * 2);
  g.fillStyle = '#f5f7fa';
  g.fill();
  g.lineWidth = 6;
  g.strokeStyle = stripeHex;
  g.stroke();
  g.fillStyle = '#151a20';
  g.font = 'bold 72px system-ui, sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(num, 455, 254);
  // 面板缝
  g.strokeStyle = 'rgba(0,0,0,0.16)';
  g.lineWidth = 2;
  for (const x of [520, 300, 860]){
    g.beginPath(); g.moveTo(x, 130); g.lineTo(x, 430); g.stroke();
  }
  // 下沿高光细线
  g.strokeStyle = 'rgba(255,255,255,0.18)';
  g.lineWidth = 3;
  g.beginPath(); g.moveTo(0, 440); g.lineTo(1024, 440); g.stroke();

  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = maxAniso;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// 碳纤维编织纹
const carbonTex = (() => {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = '#1a1e24';
  g.fillRect(0, 0, 64, 64);
  for (let y = 0; y < 64; y += 8){
    for (let x = 0; x < 64; x += 8){
      g.fillStyle = ((x / 8 + y / 8) % 2 === 0) ? 'rgba(255,255,255,0.10)' : 'rgba(0,0,0,0.38)';
      g.fillRect(x, y, 8, 8);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4, 1);
  tex.anisotropy = maxAniso;
  return tex;
})();

// 轮胎胎纹
const treadTex = (() => {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = '#14181d';
  g.fillRect(0, 0, 64, 64);
  g.fillStyle = '#222932';
  for (let x = 0; x < 64; x += 10) g.fillRect(x, 0, 5, 64);
  g.fillStyle = '#0d1014';
  g.fillRect(0, 24, 64, 16);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(12, 1);
  tex.anisotropy = maxAniso;
  return tex;
})();

// 条纹对比色：亮漆配深纹，深漆配白纹
function stripeColorFor(color){
  const c = new THREE.Color(color);
  const lum = 0.299 * c.r + 0.587 * c.g + 0.114 * c.b;
  return lum > 0.45 ? '#151a20' : '#f5f5f5';
}

// 车绘贴图缓存（同一车型+颜色+车号只生成一次）
const liveryCache = {};
function getLivery(color, num, key, stripe){
  const id = key + '|' + color + '|' + num;
  if (!liveryCache[id]) liveryCache[id] = makeLiveryTexture(color, num, stripe || stripeColorFor(color));
  return liveryCache[id];
}

const carGeosCache = {};
function getCarGeos(key){
  if (carGeosCache[key]) return carGeosCache[key];
  const t = CAR_TYPES[key];
  const tire = new THREE.CylinderGeometry(t.wheelR, t.wheelR, t.wheelW, 14);
  tire.rotateZ(Math.PI / 2);
  const rim = new THREE.CylinderGeometry(t.wheelR * 0.58, t.wheelR * 0.58, t.wheelW * 1.02, 10);
  rim.rotateZ(Math.PI / 2);
  const g = {
    body: extrudeProfile(t.body, t.width),
    cabin: extrudeProfile(t.cabin, t.cabinWidth),
    wing: new THREE.BoxGeometry(t.wing.w, t.wing.h, t.wing.d),
    post: new THREE.BoxGeometry(0.08, Math.max(0.06, t.wing.postH), 0.1),
    splitter: new THREE.BoxGeometry(t.width * 0.9, 0.06, 0.45),
    scoop: new THREE.BoxGeometry(0.75, 0.12, 0.9),
    rack: new THREE.BoxGeometry(t.width * 0.78, 0.08, t.len * 0.42),
    step: new THREE.BoxGeometry(0.16, 0.07, t.len * 0.4),
    tire, rim,
    spoke: new THREE.BoxGeometry(0.03, t.wheelR * 0.82, 0.05),
    hub: (() => { const h = new THREE.CylinderGeometry(t.wheelR * 0.22, t.wheelR * 0.22, t.wheelW * 1.08, 10); h.rotateZ(Math.PI / 2); return h; })(),
    fender: (() => { const f = new THREE.TorusGeometry(t.wheelR * 1.12, 0.055, 6, 14, Math.PI); f.rotateY(Math.PI / 2); return f; })(),
    mirror: new THREE.BoxGeometry(0.16, 0.08, 0.14),
    skirt: new THREE.BoxGeometry(0.06, 0.12, t.len * 0.42),
    grille: new THREE.BoxGeometry(t.width * 0.6, 0.14, 0.06),
    plate: new THREE.BoxGeometry(0.34, 0.16, 0.02),
    evBar: new THREE.BoxGeometry(t.width * 0.85, 0.05, 0.05),
    disc: (() => { const d = new THREE.CylinderGeometry(t.wheelR * 0.64, t.wheelR * 0.64, 0.035, 14); d.rotateZ(Math.PI / 2); return d; })(),
    caliper: new THREE.BoxGeometry(0.055, t.wheelR * 0.55, t.wheelR * 0.24),
    fin: new THREE.BoxGeometry(0.05, 0.16, 0.42),
    intake: new THREE.BoxGeometry(t.width * 0.26, 0.11, 0.07),
    vent: new THREE.BoxGeometry(t.width * 0.3, 0.025, 0.55),
    antenna: new THREE.BoxGeometry(0.05, 0.07, 0.26),
    seam: new THREE.BoxGeometry(0.012, 0.42, 0.02),
    roundLamp: (() => { const c = new THREE.CylinderGeometry(t.wheelR * 0.3, t.wheelR * 0.3, 0.06, 14); c.rotateX(Math.PI / 2); return c; })(),
    belt: new THREE.BoxGeometry(0.022, 0.038, t.cabinWidth * 0.62),
    handle: new THREE.BoxGeometry(0.03, 0.05, 0.2),
    flare: new THREE.BoxGeometry(0.11, t.wheelR * 0.95, t.wheelR * 2.25),
    lip: new THREE.BoxGeometry(t.width * 0.92, 0.08, 0.18),
    rearBar: new THREE.BoxGeometry(t.width * 0.82, 0.055, 0.05),
    endPlate: new THREE.BoxGeometry(0.035, t.wing.h * 2.6, t.wing.d * 1.02),
    seamX: new THREE.BoxGeometry(t.width * 0.82, 0.012, 0.02),
    canard: new THREE.BoxGeometry(t.width * 0.2, 0.03, 0.22),
    sidewall: (() => { const s = new THREE.TorusGeometry(t.wheelR * 1.0, 0.035, 6, 18); s.rotateY(Math.PI / 2); return s; })(),
    rimLip: (() => { const s = new THREE.TorusGeometry(t.wheelR * 0.58, 0.022, 6, 16); s.rotateY(Math.PI / 2); return s; })(),
    light: new THREE.BoxGeometry(0.4, 0.12, 0.1),
    exhaust: (() => { const e = new THREE.CylinderGeometry(0.06, 0.06, 0.2, 8); e.rotateX(Math.PI / 2); return e; })()
  };
  // 端盖 UV → 0~1（按侧视轮廓的真实范围）
  const xs = t.body.map(p => p[0]), ys = t.body.map(p => p[1]);
  normalizeUVs(g.body, Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys));
  carGeosCache[key] = g;
  return g;
}

function buildCarMeshes(g, color, num, key){
  const t = CAR_TYPES[key];
  const geos = getCarGeos(key);
  // ExtrudeGeometry 材质分组：0 = 前后端盖（车身侧面轮廓），1 = 侧壁（引擎盖/车顶/车尾）
  const stripe = (CAR_TYPES[key].cls === 'S') ? '#ffd166' : stripeColorFor(color);
  const liveryTex = getLivery(color, num, key, stripe);
  const paintCap  = new THREE.MeshPhongMaterial({ map: liveryTex, shininess: 95, specular: 0x555555 });
  const paintSide = new THREE.MeshPhongMaterial({ color, shininess: 95, specular: 0x555555 });
  const dark  = new THREE.MeshPhongMaterial({ color: 0x11161d, shininess: 160, specular: 0x8fa7bd });
  const tireMat = new THREE.MeshLambertMaterial({ map: treadTex });
  const rimMat  = new THREE.MeshPhongMaterial({ color: 0xb8bec8, shininess: 100 });
  const goldRimMat = new THREE.MeshPhongMaterial({ color: 0xd9b45a, shininess: 130, specular: 0xffffff });
  const calMat = new THREE.MeshPhongMaterial({ color: 0xc0392b, shininess: 60 });
  const carbonMat = new THREE.MeshPhongMaterial({ map: carbonTex, shininess: 60, specular: 0x333333 });

  const body = new THREE.Mesh(geos.body, [paintCap, paintSide]);
  body.castShadow = true;
  const cabin = new THREE.Mesh(geos.cabin, dark);
  cabin.castShadow = true;
  g.add(body, cabin);

  // 侧裙 + 后视镜 + 进气格栅 + 车牌
  for (const sx of [-1, 1]){
    const sk = new THREE.Mesh(geos.skirt, dark);
    sk.position.set(sx * (t.width / 2 - 0.02), 0.22, 0);
    g.add(sk);
    const mr = new THREE.Mesh(geos.mirror, dark);
    mr.position.set(sx * (t.cabinWidth / 2 + 0.08), t.height * 0.72, t.len * 0.1);
    g.add(mr);
  }
  const grille = new THREE.Mesh(geos.grille, dark);
  grille.position.set(0, t.lightF[0] - 0.16, t.len / 2 - 0.02);
  g.add(grille);
  const plate = new THREE.Mesh(geos.plate, new THREE.MeshBasicMaterial({ color: 0xe8eef5 }));
  plate.position.set(0, t.lightR[0] - 0.22, -t.len / 2 - 0.02);
  g.add(plate);

  // 镀铬腰线 + 门把手
  const chromeMat = new THREE.MeshPhongMaterial({ color: 0xb9c2cc, shininess: 140, specular: 0xffffff });
  for (const sx of [-1, 1]){
    const belt = new THREE.Mesh(geos.belt, chromeMat);
    belt.position.set(sx * (t.cabinWidth / 2 + 0.015), t.height * 0.6, t.len * 0.02);
    g.add(belt);
    for (const dz of [0.45, -0.45]){
      const hd = new THREE.Mesh(geos.handle, chromeMat);
      hd.position.set(sx * (t.width / 2 + 0.012), t.height * 0.52, dz);
      g.add(hd);
    }
  }
  // 前唇
  const lip = new THREE.Mesh(geos.lip, dark);
  lip.position.set(0, 0.16, t.len / 2 - 0.04);
  g.add(lip);

  // 门缝线（两侧各两道竖线，示意车门分割）
  for (const sx of [-1, 1]){
    for (const dz of [0.55, -0.75]){
      const sm = new THREE.Mesh(geos.seam, dark);
      sm.position.set(sx * (t.width / 2 + 0.005), t.height * 0.42, dz);
      g.add(sm);
    }
  }
  // 引擎盖散热口
  const vent = new THREE.Mesh(geos.vent, dark);
  vent.position.set(0, t.lightF[0] + 0.16, t.len * 0.26);
  g.add(vent);
  // 前保险杠两侧进气
  for (const sx of [-1, 1]){
    const ik = new THREE.Mesh(geos.intake, dark);
    ik.position.set(sx * t.width * 0.3, Math.max(0.26, t.lightF[0] - 0.3), t.len / 2 - 0.03);
    g.add(ik);
  }
  // 后扩散器鳍片
  for (const dx of [-0.5, 0, 0.5]){
    const fn = new THREE.Mesh(geos.fin, dark);
    fn.position.set(dx * t.width * 0.55, 0.2, -t.len / 2 + 0.12);
    g.add(fn);
  }
  // 鲨鱼鳍天线
  const ant = new THREE.Mesh(geos.antenna, dark);
  ant.position.set(0, t.height - 0.02, -t.len * 0.3);
  g.add(ant);

  // 尾翼 + 支柱
  const wing = new THREE.Mesh(geos.wing, carbonMat);
  wing.position.set(0, t.wing.y, t.wing.z);
  wing.castShadow = true;
  g.add(wing);
  // 尾翼端板
  for (const px of [-1, 1]){
    const ep = new THREE.Mesh(geos.endPlate, carbonMat);
    ep.position.set(px * (t.wing.w / 2 - 0.01), t.wing.y, t.wing.z);
    g.add(ep);
  }
  // 引擎盖 / 后备箱横缝
  for (const [sy, sz] of [[t.lightF[0] + 0.13, t.len * 0.22], [t.lightR[0] + 0.1, -t.len * 0.3]]){
    const sxm = new THREE.Mesh(geos.seamX, dark);
    sxm.position.set(0, sy, sz);
    g.add(sxm);
  }
  for (const px of [-0.55, 0.55]){
    const post = new THREE.Mesh(geos.post, dark);
    post.position.set(px, t.wing.y - t.wing.h / 2 - t.wing.postH / 2, t.wing.z + 0.02);
    if (t.swanNeck){
      post.rotation.z = -Math.sign(px) * 0.14;   // 天鹅颈：支柱外倾
      post.scale.y = 1.1;
    }
    g.add(post);
  }

  // 大灯 / 尾灯 / 排气
  const headMat = new THREE.MeshBasicMaterial({ color: 0xfff2b0 });
  const tailMat = new THREE.MeshBasicMaterial({ color: 0xb82020 });
  if (t.hasEvBar){
    const bar = new THREE.Mesh(geos.evBar, headMat);
    bar.position.set(0, t.lightF[0] + 0.02, t.lightF[1] + 0.02);
    g.add(bar);
  }
  for (const px of [-0.55, 0.55]){
    if (t.evBar){
    const rb = new THREE.Mesh(geos.rearBar, tailMat);
    rb.position.set(0, t.lightR[0] + 0.06, -t.len / 2 - 0.02);
    g.add(rb);
  }
  if (t.roundLights){
      const rl = new THREE.Mesh(geos.roundLamp, dark);
      rl.position.set(px * 0.86, t.lightF[0], t.lightF[1] - 0.01);
      g.add(rl);
      const rlIn = new THREE.Mesh(geos.roundLamp, headMat);
      rlIn.scale.set(0.8, 0.8, 0.5);
      rlIn.position.set(px * 0.86, t.lightF[0], t.lightF[1] + 0.02);
      g.add(rlIn);
    } else {
      const hl = new THREE.Mesh(geos.light, headMat);
      hl.position.set(px, t.lightF[0], t.lightF[1]);
      g.add(hl);
    }
    const tl = new THREE.Mesh(geos.light, tailMat);
    tl.position.set(px, t.lightR[0], t.lightR[1]);
    g.add(tl);
    if (t.exhaust){
      const ex = new THREE.Mesh(geos.exhaust, dark);
      ex.position.set(px * 0.6, t.exhaust[0], t.exhaust[1]);
      g.add(ex);
    }
  }

  // 专属件：引擎盖/车顶进气、前铲、车顶行李架、侧踏板（SUV）
  if (t.scoop){
    const sc = new THREE.Mesh(geos.scoop, carbonMat);
    sc.position.set(t.scoop[0], t.scoop[1], t.scoop[2]);
    g.add(sc);
  }
  if (t.splitter){
    const sp = new THREE.Mesh(geos.splitter, carbonMat);
    sp.position.set(0, 0.2, t.len / 2 - 0.35);
    g.add(sp);
  }
  if (t.roofRack){
    const rack = new THREE.Mesh(geos.rack, dark);
    rack.position.set(0, t.roofRackY, -0.15);
    rack.castShadow = true;
    g.add(rack);
  }
  if (t.sideSteps){
    for (const sx of [-1, 1]){
      const st = new THREE.Mesh(geos.step, dark);
      st.position.set(sx * (t.width / 2 + 0.02), 0.42, 0);
      g.add(st);
    }
  }

  // 排气火焰
  const glowMat = new THREE.MeshBasicMaterial({ color: 0xffa020, transparent: true, opacity: 0.85 });
  const glow = new THREE.Group();
  const exPos = t.exhaust || [0.3, t.len / 2 * -0.92]; // 纯电车无排气口时火焰贴在尾部
  for (const px of [-0.21, 0.21]){
    const flame = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.55, 8), glowMat);
    flame.rotation.x = -Math.PI / 2;
    flame.position.set(px, exPos[0], exPos[1] - 0.28);
    glow.add(flame);
  }
  glow.visible = false;
  g.add(glow);

  // 氮气喷射（蓝色，比漂移火焰更长）
  const nitroMat = new THREE.MeshBasicMaterial({ color: 0x7fd8ff, transparent: true, opacity: 0.9 });
  const nitroGlow = new THREE.Group();
  for (const px of [-0.2, 0.2]){
    const jet = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.9, 8), nitroMat);
    jet.rotation.x = -Math.PI / 2;
    jet.position.set(px, exPos[0], exPos[1] - 0.5);
    nitroGlow.add(jet);
  }
  nitroGlow.visible = false;
  g.add(nitroGlow);

  // 极限突破喷射（紫白，最长最亮）
  const overMat = new THREE.MeshBasicMaterial({ color: 0xd8b4fe, transparent: true, opacity: 0.95 });
  const overGlow = new THREE.Group();
  for (const px of [-0.22, 0.22]){
    const jet = new THREE.Mesh(new THREE.ConeGeometry(0.11, 1.5, 8), overMat);
    jet.rotation.x = -Math.PI / 2;
    jet.position.set(px, exPos[0], exPos[1] - 0.85);
    overGlow.add(jet);
  }
  overGlow.visible = false;
  g.add(overGlow);

  // 车轮（前两个为前轮，接入转向动画）
  const wheels = [];
  const WF = t.wheelZF ?? t.wheelZ, WR = t.wheelZR ?? t.wheelZ;
  for (const [wx, wz] of [[-t.wheelX, WF], [t.wheelX, WF], [-t.wheelX, -WR], [t.wheelX, -WR]]){
    const w = new THREE.Group();
    const tire = new THREE.Mesh(geos.tire, tireMat);
    tire.castShadow = true;
    const rim = new THREE.Mesh(geos.rim, rimMat);
    const hub = new THREE.Mesh(geos.hub, rimMat);
    const disc = new THREE.Mesh(geos.disc, new THREE.MeshPhongMaterial({ color: 0x3a3f45, shininess: 30 }));
    w.add(tire, rim, hub, disc);
    // 五辐条
    for (let s = 0; s < 5; s++){
      const sub = new THREE.Group();
      const spoke = new THREE.Mesh(geos.spoke, t.goldRim ? goldRimMat : rimMat);
      spoke.position.y = t.wheelR * 0.42;
      sub.add(spoke);
      sub.rotation.x = s * Math.PI * 2 / 5;

function updateDriftDebounce(rawPressed, dt){
  if (rawPressed && !_driftRaw.pressed){
    // 刚按下，开始计时确认
    _driftRaw.confirmT = DRIFT_CONFIRM_MS / 1000;
    _driftRaw.released = false;
  } else if (!rawPressed && _driftRaw.pressed){
    // 刚松开，开始计时释放
    _driftRaw.releaseT = DRIFT_RELEASE_MS / 1000;
    _driftRaw.released = true;
  }
  if (_driftRaw.pressed){
    if (_driftRaw.released){
      _driftRaw.releaseT -= dt;
      if (_driftRaw.releaseT <= 0){
        _driftRaw.pressed = false; // 稳定释放
      }
    }
  } else {
    if (!_driftRaw.released){
      _driftRaw.confirmT -= dt;
      if (_driftRaw.confirmT <= 0 && rawPressed){
        _driftRaw.pressed = true; // 稳定按下

    }
  }

/* ============ AI 控制：沿中心线（带偏移）追踪前方点 + 弯道限速 ============ */
function aiControl(r){
  const speed = Math.abs(r.vf);
  const M = r.maxSpeed;
  const dsPer = trackLenValue / N_SAMPLES;

  // 前视（距离制 + 上限，发夹弯里不会望到对面）
  const lookM = clamp(8 + speed * 0.5, 8, 22);
  const look = Math.max(3, Math.round(lookM / dsPer));
  const ti = (r.nearestI + look) % N_SAMPLES;
  const t = T[ti];
  const tx = S[ti].x + t.z * r.aiOffset;
  const tz = S[ti].z - t.x * r.aiOffset;
  const desired = Math.atan2(tx - r.pos.x, tz - r.pos.z);
  const steer = clamp(wrapAngle(desired - r.yaw) * P.aiSteerGain, -1, 1);

  // 前方 30m 内最小转弯半径
  let kMax = 0;
  const span = Math.max(4, Math.round(30 / dsPer));
  for (let k = 0; k < span; k++){
    const i = (r.nearestI + k) % N_SAMPLES;
    if (trackCurv[i] > kMax) kMax = trackCurv[i];
  }
  const R = kMax > 1e-4 ? 1 / kMax : 9999;

  // 急弯入口还有多远（第一个半径 < 45m 的采样点）
  let dCorner = Infinity;
  for (let k = 0; k < span; k++){
    const i = (r.nearestI + k) % N_SAMPLES;
    if (trackCurv[i] > 1 / 45){ dCorner = k * dsPer; break; }
  }

  const safeV = (k) => {
    const rk = (R === 9999 ? 1e5 : R) * k;
    return Math.min(M, rk / (1 + rk * P.steerFade / M));
  };
  const vGrip  = safeV(P.steerRate) * r.skill;
  const vDrift = safeV(P.steerRate * P.driftSteerBoost) * r.skill;
  const vEntry = Math.min(M, vDrift * 0.9);   // 带漂移允许的入弯速度
  const inCorner = dCorner < 18;

  let throttle = 0, brake = 0;
  if (!inCorner){
    // 还没进弯：先刹车把速度压到入弯速度（提前 60m 开始）
    const target = dCorner < 60 ? vEntry : M * 0.98;
    throttle = speed < target ? 1 : 0;
    brake = speed > target * 1.03 ? 1 : 0;
  } else {
    // 已经进弯：超速继续刹，只有超过抓地极限才拉手刹
    throttle = speed < vDrift * 0.82 ? 1 : 0;
    brake = speed > vEntry * 1.04 ? 1 : 0;
  }

  const vl = r.vel.x * Math.cos(r.yaw) - r.vel.z * Math.sin(r.yaw);
  const spinning = Math.abs(vl) > 20;
  const hand = inCorner && !spinning && speed > vGrip * 0.98 && speed > 8;

  return { steer, throttle, brake, hand };
}

      if (!Number.isFinite(t) || !Number.isFinite(x) || !Number.isFinite(z) || !Number.isFinite(yaw)) continue;
      if (t <= lastT) continue;                       // 必须严格递增
      if (Math.abs(x) > 1e6 || Math.abs(z) > 1e6 || Math.abs(yaw) > 1e3) continue; // 异常坐标/角度
      arr.push({ t, x, z, yaw });
      lastT = t;
      if (arr.length >= MAX_GHOST_FRAMES) break;      // 超限截断
    }
    return arr.length >= 2 ? arr : null;
  } catch (_) { return null; }
}

  // 终排名：冲线顺序优先，未完赛按进度排
  const sorted = [...racers].sort((a, b) => {
    if (a.finishOrder && b.finishOrder) return a.finishOrder - b.finishOrder;
    if (a.finishOrder) return -1;
    if (b.finishOrder) return 1;
    return b.progress - a.progress;
  });
  const hex = c => '#' + c.toString(16).padStart(6, '0');
  resultList.innerHTML = sorted.map(r =>
    '<li class="' + (r.isPlayer ? 'me' : '') + '">'
    + (r.finishOrder ? '第 ' + r.finishOrder + ' 名' : '未完赛')
    + '　<span class="chip" style="background:' + hex(r.color) + '"></span>'
    + r.name + ' — '
    + (r.finishOrder ? '总用时 ' + fmt(r.finishTime) : '跑到第 ' + (r.lap + 1) + ' 圈')
    + '</li>').join('');
  const myPos = sorted.findIndex(r => r.isPlayer) + 1;
  resultTitle.textContent = myPos === 1 ? '胜利！你是第 1 名' : '比赛结束 · 你是第 ' + myPos + ' 名';

  } else if (state === 'paused'){
    state = 'running';
    resetAllInputs(); // 恢复前再清一次，兜底暂停期间的任何按键残留
    showPanel('home');            // 先把面板切走，再隐藏覆盖层
    overlay.classList.add('hidden');
    clock.getDelta();             // 丢弃暂停期间累积的 delta
  }
}
// 退出比赛，回到主菜单
function quitToMenu(){
  state = 'menu';
  resetAllInputs();
  showPanel('home');
  overlay.classList.remove('hidden');
  clock.getDelta();
}

/* ============ 物理更新（玩家与 AI 共用；input = {steer,throttle,brake,hand}） ============ */
function stepRacer(r, input, dt){
  const fx = Math.sin(r.yaw), fz = Math.cos(r.yaw);      // 车头
  const lx = Math.cos(r.yaw), lz = -Math.sin(r.yaw);     // 车左侧
  let vf = r.vel.x * fx + r.vel.z * fz;
  let vl = r.vel.x * lx + r.vel.z * lz;

  // 最近采样点 → 冲出赛道判定 + 计圈进度
  // 局部窗口搜索：车速上限 100m/s × 最大步长 1/30s ≈ 3.3m/帧，采样间距约 1.4m，
  // 上次最近点 ±90 采样（±125m）必然覆盖；把每车每帧 1800 次循环降为 181 次
  // （4 车 60fps 时主线程每秒少跑约 39 万次循环）
  const base = r.nearestI | 0;
  let ni = base, nd = Infinity;
  for (let k = -90; k <= 90; k++){
    const i = (base + k + N_SAMPLES) % N_SAMPLES;
    const dx = r.pos.x - S[i].x, dz = r.pos.z - S[i].z, d = dx*dx + dz*dz;
    if (d < nd){ nd = d; ni = i; }
  }
  if (nd > 3600){   // 兜底：异常远离赛道（如未来加入传送）时退回全表扫描
    nd = Infinity;
    for (let i = 0; i < N_SAMPLES; i++){
      const dx = r.pos.x - S[i].x, dz = r.pos.z - S[i].z, d = dx*dx + dz*dz;
      if (d < nd){ nd = d; ni = i; }
    }
  }
  r.nearestI = ni;
  const offTrack = Math.sqrt(nd) > hw + 1.05;   // 护栏在 hw+1.1，贴护栏不算出赛道（护栏已保证车不冲出）

  // 转向：用角速度 + 阻尼模拟车身重量感，避免"轻飘飘"
  const speed = Math.abs(vf);
  // smoothstep：低速温柔建立方向，避免一按就猛转
  const steerSmooth = (speed < 12)
    ? (speed / 12) * (speed / 12) * (3 - 2 * (speed / 12))
    : Math.min(1, speed / 35);
  // 高速衰减
  const steerHighFade = 1.0 - P.steerFade * Math.min(1, speed / P.PEAK_SPEED);
  // 漂移时转向更灵活：提高 caps 和响应速度
  const isDrift = input.hand;
  const driftYawMult = isDrift ? 2.0 : 1.0;  // 漂移时允许更高转向速度（2倍）
  let targetYawSpeed = input.steer * P.steerRate
    * steerSmooth
    * steerHighFade
    * (isDrift ? P.driftSteerBoost : 1);
  const maxYaw = P.driftYawCap * driftYawMult;
  if (isDrift) targetYawSpeed = clamp(targetYawSpeed, -maxYaw, maxYaw);
  // 角速度惯性 + 阻尼：车头不会瞬间达到目标转速，有重量的感觉
  // 高速时增加额外阻尼，防止"飘"
  const highSpeedDamp = 1.0 + 0.02 * Math.max(0, speed - 30);  // 30m/s 以上开始加重阻尼
  const yawInertia = isDrift ? 10.0 : 3.0;  // 漂移时惯性适中，转向有重量感
  const yawDamp = isDrift ? 5.0 : 4.0 * highSpeedDamp;  // 漂移时阻尼增加，转向更费力
  r.yawSpeed += (targetYawSpeed - r.yawSpeed) * Math.min(1, yawInertia * dt);
  r.yawSpeed *= (1 - yawDamp * dt);              // 阻尼衰减，松手后自然减速
  // 高速限速：超过 60m/s 后最大转向速率随速度降低（防飘）
  const speedYawCap = speed > 60 ? P.driftYawCap * (60 / speed) : P.driftYawCap;
  r.yawSpeed = clamp(r.yawSpeed, -speedYawCap, speedYawCap);
  r.yaw += r.yawSpeed * dt * (vf < -0.5 ? -1 : 1);
  // 漂移回正：松开方向时车头自然甩回速度方向——松箭头=收漂移，不用手刹键收
  if (input.hand && Math.abs(input.steer) < 0.25 && speed > 5 && vf > 0){
    const velAng = Math.atan2(r.vel.x, r.vel.z);
    r.yaw += wrapAngle(velAng - r.yaw) * Math.min(1, 5.0 * dt);
  }

  // 完美漂移判定（锁存式）：按住空格期间累积时长，只要出现过一次真侧滑即标记；
  // 松开空格瞬间若累积达标 → 触发短时加速奖励。冲出赛道立即作废。
  const driftActive = input.hand && speed > P.driftMinSpeed && !offTrack;
  if (driftActive){
    if (Math.abs(vl) > P.driftSlipMin) r.slipped = true;
    // 记录漂移期间的速度损失
    if (speed > 0 && !r.drifted){
      r.drifted = true;
      r.driftEntrySpeed = speed;
      r.driftLoss = 0;
    }
    if (r.drifted) r.driftLoss += Math.max(0, r.driftEntrySpeed - speed) * dt * 0.5;
    r.driftT += dt;
  } else {
    // 漂移结束，判定是否完美并补偿
    if (!input.hand && r.driftT >= P.driftMinTime && r.slipped && !offTrack){
      r.boostT = P.boostDuration * r.sk.boostDur;
      // 补偿：把漂移期间损失的速度补回来，但不超过进入漂移时的速度
      const recover = Math.min(r.driftLoss * 0.9, r.driftEntrySpeed - speed);
      vf = Math.min(vf + recover, r.driftEntrySpeed * P.boostGain);
      if (r.isPlayer) flash('完美漂移！补偿 ' + Math.round(recover * 3.6) + ' km/h', 1200);
    }
    r.drifted = false;
    r.driftT = 0; r.driftLoss = 0; r.slipped = false;
  }
  if (r.boostT > 0) r.boostT = Math.max(0, r.boostT - dt);

  // 尾灯：非刹车暗红，刹车亮红
  if (r.tailMat) r.tailMat.color.setHex(input.brake ? 0xff4040 : 0xb82020);

  // 氮气（玩家专属）：按住 Shift 消耗，松开回充，漂移额外充能
  let nitroMul = 1, nitroAcc = 1;
  if (r.isPlayer){
    const want = !!input.nitro;
    // 极限突破：按下瞬间触发（需冷却完毕、次数未满），期间速度上限 ×2
    if (input.over && r.overCd <= 0 && r.overT <= 0 && r.overUses < 2){
      r.overT = P.overDuration;
      r.overCd = (P.overDuration + P.overCooldown) * r.sk.overCd;
      r.overUses++;
      flash('极限突破！速度上限 +100%（剩余 ' + (2 - r.overUses) + ' 次）', 1600);
    }
    if (r.overT > 0) r.overT = Math.max(0, r.overT - dt);
    if (r.overCd > 0) r.overCd = Math.max(0, r.overCd - dt);
    if (want && r.nitro > P.nitroMin){
      r.nitro = Math.max(0, r.nitro - P.nitroDrain * r.sk.nitroDrain * dt);
      r.nitroOn = r.nitro > 0;
    } else {
      r.nitroOn = false;
      if (!want) r.nitro = Math.min(100, r.nitro + P.nitroRegen * r.sk.nitroRegen * (input.brake ? r.sk.brakeRegen : 1) * dt);
    }
    if (r.driftT > 0.2) r.nitro = Math.min(100, r.nitro + P.nitroDriftGain * r.sk.nitroDrift * dt);
    if (r.nitroOn){ nitroMul = P.nitroGain; nitroAcc = P.nitroAccelMul; }
    // 手机点按式氮气：喷完自动熄灭并复位按钮高亮（否则 want 常驻 true 会阻塞回充）
    if (r.nitro <= 0 && nitroLatch){
      nitroLatch = false;
      if (nitroBtnEl){ nitroBtnEl.classList.remove('pressed'); nitroBtnEl.classList.remove('spraying'); }
    }
    if (r.overT > 0){ nitroMul *= P.overGain; nitroAcc *= P.overAccelMul; }
  }

  // 纵向（阶梯衰减 + 硬限速：玩家有全局峰值 P.PEAK_SPEED，仅氮气和极限突破可越过；AI 仍用各自车型极速）
  const cap = (r.isPlayer ? P.PEAK_SPEED : r.maxSpeed) * (r.boostT > 0 ? P.boostGain : 1) * nitroMul;
  const driftAccelMul = (input.hand && r.boostT <= 0) ? 0.0 : 1.0;  // 漂移时加速度归零，完美漂移出弯后恢复正常
  if (input.throttle){
    const x = Math.max(0, vf) / cap;
    const te = r.sk.taperEnd;   // 衰减起点（部分车高速段不衰减）
    const taper = x < te ? 1 : Math.max(0.25, 1 - (x - te) / (1 - te));
    const lowMul = (vf < 10) ? r.sk.lowAccel : 1;   // 低速段加成（起步/出弯）
    vf += r.accel * (r.boostT > 0 ? P.boostGain : 1) * nitroAcc * driftAccelMul * dt * taper * lowMul;
  }
  vf = Math.min(vf, cap);
  if (input.brake){
    if (vf > 0.5) vf -= P.brake * dt;
    else vf = Math.max(vf - P.reverseAccel * dt, -P.maxReverse);
  }
  vf -= vf * P.drag * dt;
  vf -= Math.sign(vf) * Math.min(Math.abs(vf), P.rolling * dt);
  // 草地衰减已删除：护栏保证车无法冲出赛道，offTrack 不再触发减速
  // 横向抓地（hand = 漂移）
  const grip = (input.hand ? P.driftGrip : P.grip) * (input.hand ? 1 : r.sk.grip);
  const vlLost = vl * Math.min(1, grip * dt);   // 本帧被抓地"拉回"的侧滑量
  vl -= vlLost;
  // 甩尾动能回收：拉回的侧滑按 50% 转为前进动力——漂移有收益但不完全补偿
  if (input.hand) vf += Math.abs(vlLost) * 0.5;

  // 漂移蹭速：轮胎侧向摩擦消耗动能，侧滑越大、速度掉得越多（油门也拉不回来）
  if (input.hand && Math.abs(vl) > 1.2){
    const scrubRate = P.driftScrub * Math.min(1, Math.abs(vl) / 10);
    vf -= vf * scrubRate * dt;
  }

  r.vel.set(fx * vf + lx * vl, 0, fz * vf + lz * vl);
  r.pos.addScaledVector(r.vel, dt);
  // 护栏碰撞：两侧都检测，超出即推回并反弹
  if (window.__barrierDist) {
    const bi = Math.max(0, Math.min(N_SAMPLES - 1, r.nearestI));
    const p = S[bi], t = T[bi];
    const nx = t.z, nz = -t.x; // 左法线（赛道左侧向外）
    const barLx = p.x + nx * window.__barrierDist;
    const barLz = p.z + nz * window.__barrierDist;
    const barRx = p.x - nx * window.__barrierDist;
    const barRz = p.z - nz * window.__barrierDist;
    const dLx = r.pos.x - barLx, dLz = r.pos.z - barLz;
    const dRx = r.pos.x - barRx, dRz = r.pos.z - barRz;
    // 检查左护栏（法线指向外侧）和右护栏（-法线指向外侧）
    const penL = dLx * nx + dLz * nz;
    const penR = dRx * (-nx) + dRz * (-nz);
    if (penL > 0 || penR > 0) {
      const pen = Math.max(penL, penR);
      const bnx = penL >= penR ? nx : -nx;
      const bnz = penL >= penR ? nz : -nz;
      r.pos.x -= bnx * pen;
      r.pos.z -= bnz * pen;
      const vn = r.vel.x * bnx + r.vel.z * bnz;
      if (vn > 0) {
        r.vel.x -= 1.6 * vn * bnx;
        r.vel.z -= 1.6 * vn * bnz;
        r.vf = Math.max(0, r.vf * 0.55);
      }
    }
  }
  r.vf = vf;

  // 漂移轮胎印：后轮两个接触点连线铺设带状痕迹
  const skidOn = !offTrack && speed > 5 && input.hand && Math.abs(vl) > 1.2;
  if (skidOn){
    const wt = CAR_TYPES[r.carType] || CAR_TYPES.default;
    const cosY = Math.cos(r.yaw), sinY = Math.sin(r.yaw);
    const back = wt.wheelZR || wt.wheelZ || 1.3;
    const halfW = Math.max(0.09, (wt.wheelW || 0.3) * 0.55);
    if (!r.skidPrev) r.skidPrev = [null, null];
    for (let i = 0; i < 2; i++){
      const ox = (i === 0 ? -1 : 1) * (wt.wheelX || 0.9);
      const oz = -back;
      const wx = r.pos.x + ox * cosY + oz * sinY;
      const wz = r.pos.z - ox * sinY + oz * cosY;
      const p = r.skidPrev[i];
      if (p){
        if (Math.hypot(wx - p[0], wz - p[1]) > 0.14){
          addSkidSegment(p[0], p[1], wx, wz, halfW);
          r.skidPrev[i] = [wx, wz];
        }
      } else {
        r.skidPrev[i] = [wx, wz];
      }
    }
  } else if (r.skidPrev){
    r.skidPrev = null;
  }

  // 视觉：车身姿态（侧倾+俯仰）+ 前轮转向
  r.group.position.copy(r.pos);
  r.group.rotation.y = r.yaw;
  // 侧倾：基于 yawSpeed，漂移时更大，低速时衰减
  const rollTarget = r.yawSpeed * P.roll * 0.3 * steerSmooth;
  const driftRollMul = isDrift ? 2.5 : 1.0;
  r.rollAngle = (r.rollAngle || 0);
  r.rollAngle += (rollTarget * driftRollMul - r.rollAngle) * Math.min(1, 6 * dt);  // 更快的侧倾响应
  r.group.rotation.z = r.rollAngle;
  // 俯仰：加速后仰，刹车前倾
  const pitchTarget = (input.throttle ? -0.03 : 0) + (input.brake ? 0.05 : 0);
  r.pitchAngle = (r.pitchAngle || 0);
  r.pitchAngle += (pitchTarget - r.pitchAngle) * Math.min(1, 5 * dt);  // 更快的俯仰响应
  r.group.rotation.x = r.pitchAngle;
  // 前轮转向：速度越高角度越小（参考跑跑卡丁车/QQ飞车机制）
  const steerAngle = input.steer * 0.5 * Math.max(0.3, 1 - speed / P.PEAK_SPEED);
  const spin = (vf / 0.35) * dt;
  r.wheels.forEach((w, i) => {
    w.rotation.x += spin;
    if (i < 2) w.rotation.y = steerAngle;
  });
  // 奖励火焰
  if (r.glow){
    r.glow.visible = r.boostT > 0;
    if (r.glow.visible) r.glow.scale.setScalar(0.8 + Math.random() * 0.5);
  }
  // 氮气喷射
  if (r.nitroGlow){
    r.nitroGlow.visible = !!r.nitroOn;
    if (r.nitroGlow.visible) r.nitroGlow.scale.set(1, 1, 0.85 + Math.random() * 0.4);
  }
  // 极限突破喷射
  if (r.overGlow){
    r.overGlow.visible = r.overT > 0;
    if (r.overGlow.visible) r.overGlow.scale.set(1, 1, 0.9 + Math.random() * 0.5);
  }

  // 圈速进度（弧长比例 s ∈ [0,1)）
  const s = ni / N_SAMPLES;
  r.s = s;
  let ds = s - r.prevS;
  if (ds > 0.5) ds -= 1; else if (ds < -0.5) ds += 1;
  r.prevS = s;

  if (trackOpen){
    // —— 直线测试：跑到尽头保持车速瞬移回起点，持续测极速 ——
    if (ni >= N_SAMPLES - 5){
      const back = 3, tb = T[back];
      r.pos.set(S[back].x, 0, S[back].z);
      r.yaw = Math.atan2(tb.x, tb.z);
      r.nearestI = back;
      r.s = back / N_SAMPLES; r.prevS = r.s;
      syncRacer(r);
      if (r.isPlayer) flash('到头了 · 回到起点继续加速', 1200);
    }
    const kmhNow = Math.abs(r.vf) * 3.6;
    if (r.isPlayer && kmhNow > (r.topSpeed || 0)) r.topSpeed = kmhNow;
  } else {
  const target = CP_FRACS[r.nextCp];
  let d = s - target;
  if (d > 0.5) d -= 1; else if (d < -0.5) d += 1;
  if (Math.abs(d) < CP_WINDOW && ds > 0){
    if (r.nextCp === 0 && r.cp3Done){
      r.lap++;
      r.lastLap = raceTime - r.lapStartTime;
      r.lapStartTime = raceTime;
      if (r.isPlayer){
        lapCount = r.lap;
        if (mode === 'practice'){
          // 练习模式：刷新最快圈时保存本圈轨迹作为新幽灵
          let isBest = false;
          if (bestLap == null || r.lastLap < bestLap){
            bestLap = r.lastLap; isBest = true;
            // 保存前先清洗：只把合法帧写进存档，避免异常数据入库
            const clean = sanitizeGhost(ghostRec);
            if (clean){
              ghostData = clean;
              try {
                localStorage.setItem(bestKey(), String(bestLap));
                localStorage.setItem(ghostKey(), JSON.stringify(clean));
              } catch (_) {}
            }
          }
          // 本圈录制结束：立刻开一段新缓冲，避免上一圈数据混进下圈（旧 bug：幽灵永远只有第一圈）
          ghostRec = [{ t: 0, x: r.pos.x, z: r.pos.z, yaw: r.yaw }];
          recTimer = 0;
          flash('第 ' + lapCount + ' 圈完成 ' + fmt(r.lastLap)
            + (isBest ? '  ★ 新纪录！幽灵已更新' : ''));
        } else {
          if (r.lap === TOTAL_LAPS - 1){
            flash('最后一圈！');
          } else if (!r.finishOrder){
            flash('第 ' + lapCount + ' 圈完成 ' + fmt(r.lastLap)
              + ' · 当前名次 ' + r.rank + '/4');
          }
        }
      }
      // 竞技模式：跑满 TOTAL_LAPS 即冲线，按冲线顺序记名次
      if (mode === 'race' && r.lap >= TOTAL_LAPS && !r.finishOrder){
        r.finishOrder = ++finishCount;
        r.finishTime = raceTime;
        if (r.isPlayer) endRace();
      }
    }
    if (r.nextCp === 3) r.cp3Done = true;
    r.nextCp = (r.nextCp + 1) % CP_FRACS.length;
  }
  }

  // AI 卡死保护：踩油门却长时间不动 → 拉回中心线
  if (!r.isPlayer){
    if (input.throttle > 0 && Math.abs(r.vf) < 0.8) r.stuckT += dt; else r.stuckT = 0;
    if (r.stuckT > P.aiStuckTime){
      placeRacerAt(r, ni, r.aiOffset);
      r.stuckT = 0;
    }
  }
}

/* ============ 车对车碰撞（双圆近似 + 冲量交换） ============ */
function collideRacers(){
  const e = P.colBounce;
  for (let a = 0; a < racers.length; a++){
    for (let b = a + 1; b < racers.length; b++){
      const A = racers[a], B = racers[b];
      if (!A.group.visible || !B.group.visible) continue; // 练习模式下 AI 车隐藏，不参与碰撞
      // 按各自车型的碰撞尺寸（宽→半径，长→前后圆心偏移）
      const RA = A.colR, RB = B.colR, OA = A.colOff, OB = B.colOff;
      const dMax = OA + OB + RA + RB;
      const ddx = B.pos.x - A.pos.x, ddz = B.pos.z - A.pos.z;
      if (ddx * ddx + ddz * ddz > dMax * dMax) continue; // 粗剔除

      let touched = false;
      for (const ca of [-OA, OA]){
        const sax = Math.sin(A.yaw), caz = Math.cos(A.yaw);
        const ax = A.pos.x + sax * ca, az = A.pos.z + caz * ca;
        for (const cb of [-OB, OB]){
          const sbx = Math.sin(B.yaw), cbz = Math.cos(B.yaw);
          const bx = B.pos.x + sbx * cb, bz = B.pos.z + cbz * cb;
          let nx = bx - ax, nz = bz - az;
          const d = Math.hypot(nx, nz);
          if (d >= RA + RB || d < 1e-6) continue;
          nx /= d; nz /= d;
          touched = true;

          // 位置分离：各退一半重叠量
          const overlap = RA + RB - d;
          A.pos.x -= nx * overlap / 2; A.pos.z -= nz * overlap / 2;
          B.pos.x += nx * overlap / 2; B.pos.z += nz * overlap / 2;

          // 冲量：仅在相互接近时沿法线交换速度（等质量，弹性 e）
          const rvn = (B.vel.x - A.vel.x) * nx + (B.vel.z - A.vel.z) * nz;
          if (rvn < 0){
            const j = -(1 + e) * rvn / 2;
            A.vel.x -= nx * j; A.vel.z -= nz * j;
            B.vel.x += nx * j; B.vel.z += nz * j;
          }
        }
      }
      if (touched){
        // 分离/冲量后同步网格位置，并重算沿车头速度分量（HUD/车轮/相机用）
        for (const r of [A, B]){
          r.group.position.copy(r.pos);
          r.vf = r.vel.x * Math.sin(r.yaw) + r.vel.z * Math.cos(r.yaw);
        }
      }
    }
  }
}

/* ============ 实时排名 ============ */
function updateStandings(){
  for (const r of racers) r.progress = r.lap + r.s;
  // 已冲线的按冲线顺序排前，其余按进度
  const sorted = [...racers].sort((a, b) => {
    if (a.finishOrder && b.finishOrder) return a.finishOrder - b.finishOrder;
    if (a.finishOrder) return -1;
    if (b.finishOrder) return 1;
    return b.progress - a.progress;
  });
  sorted.forEach((r, i) => r.rank = i + 1);
}

let gIdx = 0, gLastT = -1;
function updateGhost(){
  if (mode !== 'practice' || !ghostData || ghostData.length < 2){
    ghostMesh.visible = false;
    return;
  }
  const t = raceTime - player.lapStartTime;
  if (t < gLastT) gIdx = 0;      // 新一圈从头回放
  gLastT = t;
  const arr = ghostData;
  if (t >= arr[arr.length - 1].t){ ghostMesh.visible = false; return; } // 幽灵已冲线
  while (gIdx < arr.length - 2 && arr[gIdx + 1].t <= t) gIdx++;
  while (gIdx > 0 && arr[gIdx].t > t) gIdx--;
  const a = arr[gIdx], b = arr[gIdx + 1];
  const f = b.t > a.t ? clamp((t - a.t) / (b.t - a.t), 0, 1) : 0;
  ghostMesh.visible = true;
  ghostMesh.position.set(a.x + (b.x - a.x) * f, 0, a.z + (b.z - a.z) * f);
  ghostMesh.rotation.y = a.yaw + wrapAngle(b.yaw - a.yaw) * f;
}

/* 拖拽（Pointer Events：鼠标 + 触屏统一处理） */
let dragBtn = null, dragOffX = 0, dragOffY = 0;
{
  const tl = document.getElementById('touchLayer');
  // 触屏编辑模式：捕获阶段拦截触控，不传给游戏按钮（拖拽交给 pointer 事件）
  tl.addEventListener('touchstart', e => {
    if (!layoutEdit) return;
    // 「完成」条不拦截，让它的 click 正常触发
    if (e.target.closest('#layoutEditBar')) return;
    e.stopPropagation(); e.preventDefault();
  }, {capture:true, passive:false});

  tl.addEventListener('pointerdown', e => {
    if (!layoutEdit) return;
    if (e.target.closest('#layoutEditBar')) return;
    const btn = e.target.closest('.touch-zone');
    if (!btn) return;
    e.preventDefault();
    const br = btn.getBoundingClientRect();
    dragOffX = e.clientX - br.left;
    dragOffY = e.clientY - br.top;
    dragBtn = btn;
    if (btn.setPointerCapture){ try { btn.setPointerCapture(e.pointerId); } catch (_) {} }
  });
  tl.addEventListener('pointermove', e => {
    if (!layoutEdit || !dragBtn) return;
    const base = tl.getBoundingClientRect();
    const x = Math.max(0, Math.min(base.width - dragBtn.offsetWidth, e.clientX - base.left - dragOffX));
    const y = Math.max(0, Math.min(base.height - dragBtn.offsetHeight, e.clientY - base.top - dragOffY));
    dragBtn.style.left = x + 'px';
    dragBtn.style.top = y + 'px';
  });
  const endDrag = () => { dragBtn = null; };
  tl.addEventListener('pointerup', endDrag);
  tl.addEventListener('pointercancel', endDrag);
}

// 用主渲染器把当前车型渲染成缩略图（离屏 RenderTarget → ImageData → dataURL）
function makeCarThumb(key){
  const w = 224, h = 133;   // 显示尺寸 112×64 的 2 倍已足够清晰；回读与 PNG 编码量减半
  const rt = new THREE.WebGLRenderTarget(w, h);
  rt.texture.colorSpace = THREE.SRGBColorSpace;
  const sc = new THREE.Scene();
  sc.background = new THREE.Color(0x10151c);
  sc.add(new THREE.HemisphereLight(0xdff0ff, 0x2a2f36, 1.3));
  const dl = new THREE.DirectionalLight(0xffffff, 1.5);
  dl.position.set(5, 9, 6);
  sc.add(dl);
  const g = new THREE.Group();
  buildCarMeshes(g, paintOf(key), '1', key);
  g.rotation.y = 0.72;
  sc.add(g);
  const cam = new THREE.PerspectiveCamera(38, w / h, 0.1, 80);
  cam.position.set(4.8, 2.5, 6.0);
  cam.lookAt(0, 0.62, 0);

  const prev = renderer.getRenderTarget();
  renderer.setRenderTarget(rt);
  renderer.clear();
  renderer.render(sc, cam);
  const buf = new Uint8Array(w * h * 4);
  renderer.readRenderTargetPixels(rt, 0, 0, w, h, buf);
  renderer.setRenderTarget(prev);
  rt.dispose();

  // WebGL 像素是上下颠倒的，翻转后写入 canvas
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(w, h);
  for (let y = 0; y < h; y++){
    const src = (h - 1 - y) * w * 4, dst = y * w * 4;
    img.data.set(buf.subarray(src, src + w * 4), dst);
  }
  ctx.putImageData(img, 0, 0);
  return cv.toDataURL('image/png');
}

function respawnStreak(m, anywhere){

  m.position.set(Math.cos(a) * r, Math.sin(a) * r + 1.2, anywhere ? Math.random() * 36 - 18 : -18);

{

function updateStreaks(dt){
  const vis = clamp((Math.abs(player.vf) - 14) / 26, 0, 1); // 50km/h 以下不出现
  streakMat.opacity = vis * 0.45;
  streakGroup.visible = vis > 0.02;
  if (!streakGroup.visible) return;
  streakGroup.position.copy(camera.position);
  streakGroup.quaternion.copy(camera.quaternion);
  const adv = Math.abs(player.vf) * dt * 2.6;   // 粒子向车尾流动（流速略超车速，制造掠过感）
  const len = 1 + Math.abs(player.vf) * 0.16;   // 越快拖得越长
  for (const m of streakGroup.children){
    m.position.z += adv;
    m.scale.z = len;
    if (m.position.z > 18) respawnStreak(m, false);
  }
}

/* ============ 相机（追玩家车） ============ */
let camSnap = true;
let _fxO = 0;   // 屏幕暗角透明度缓存（变化超阈值才写 style，避免每帧触发布局）
const camPos = new THREE.Vector3(0, 60, 140);
const lookPt = new THREE.Vector3();
function updateCamera(dt){
  const fx = Math.sin(player.yaw), fz = Math.cos(player.yaw);
  const t = CAR_TYPES[player.carType] || { len: 4.4, height: 1.3 };
  // 追尾机位：back = 沿车头方向的后退量；up = 机位高度；ahead = 注视点前移量
  const back = player.camDist || P.camDist, up = P.camHeight;
  const tx = player.pos.x - fx * back;
  const tz = player.pos.z - fz * back;
  const ty = player.pos.y + up;
  // 硬跟随，无延迟
  camPos.x = tx;
  camPos.y = ty;
  camPos.z = tz;
  camSnap = false;
  camera.position.copy(camPos);
  // 视线朝车前方（用前向向量而非侧向）
  const lookDist = 15;
  const lookX = player.pos.x + fx * lookDist;
  const lookZ = player.pos.z + fz * lookDist;
  lookPt.set(lookX, player.pos.y + 0.8, lookZ);
  camera.lookAt(lookPt);
  // 速度感：固定 FOV + 屏幕暗角（不加镜头抖动，保持稳定）
  const sp = Math.min(1, Math.abs(player.vf) / P.PEAK_SPEED);
  setFov(62);   // FOV 没变就不重算投影矩阵
  const fxO = sp * sp * 0.85;   // 暗角：低速无感，极速明显收边；变化超阈值才写样式
  if (Math.abs(fxO - _fxO) > 0.02){ _fxO = fxO; speedFxEl.style.opacity = fxO.toFixed(3); }
  updateStreaks(dt);
  dirLight.position.set(player.pos.x + 40, 70, player.pos.z + 20);
  dirLight.target.position.copy(player.pos);
  dirLight.target.updateMatrixWorld();
  // 路面纹理随车速沿 z 滚动，产生“路面掠过”的速度参照感
  if (roadMat && roadMat.map){
    // offset 是 shader uniform，改它无需重传贴图；原 needsUpdate 会每帧重新上传整张纹理
    roadMat.map.offset.y = (roadMat.map.offset.y - Math.abs(player.vf) * dt * 0.012) % 1;
  }
}

/* ============ 倒计时车辆展示机位 ============
 * 1s 低机位绕车 → 3-2-1 期间边绕边升高，最后 0.x 秒正好落回标准追尾位，
 * 松开倒计时后就由 updateCamera 的平滑插值无缝接上，不会跳镜头。 */
const CD_TOTAL = 4;   // 必须与 restart() 里的 countdownT 初始值一致
function updateCountdownCamera(){
  const p = clamp(1 - countdownT / CD_TOTAL, 0, 1);
  const e = p * p * (3 - 2 * p);            // smoothstep：起停都柔，中间快
  const a = player.yaw + Math.PI + 2.1 * (1 - e);  // 从车头左前方绕到车尾
  const r = 15 - 2.5 * e;                          // 15 → 15.5（等于标准 camDist）
  const h = 1.6 + 2.9 * e;                         // 低角度贴地起，逐渐升高
  camPos.set(player.pos.x + Math.sin(a) * r, player.pos.y + h, player.pos.z + Math.cos(a) * r);
  camera.position.copy(camPos);
  lookPt.set(player.pos.x, player.pos.y + 0.85, player.pos.z);
  camera.lookAt(lookPt);
  setFov(62 - 6 * e);                       // 轻微推镜，聚焦车身
}
